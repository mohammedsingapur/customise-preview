<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hakimi Pro | Admin</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root { --primary: #0f172a; --accent: #2563eb; --bg: #f1f5f9; --border: #e2e8f0; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { font-family: 'Inter', sans-serif; background: var(--bg); margin: 0; height: 100vh; display: flex; overflow: hidden; }

        /* --- LOGIN SCREEN --- */
        #login-view {
            position: fixed; inset: 0; z-index: 50;
            background: rgba(255,255,255,0.9); backdrop-filter: blur(5px);
            display: flex; align-items: center; justify-content: center;
        }
        .auth-card {
            background: white; width: 90%; max-width: 350px; padding: 30px;
            border-radius: 16px; box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            text-align: center; border: 1px solid white;
        }
        .auth-inp {
            width: 100%; padding: 14px; margin-bottom: 12px;
            border: 1px solid var(--border); border-radius: 8px; font-size: 16px; background: #f8fafc;
        }
        .btn-primary {
            width: 100%; padding: 14px; background: var(--primary); color: white;
            border: none; border-radius: 8px; font-weight: 600; font-size: 16px; margin-top: 10px;
        }
        .error-msg { color: #dc2626; font-size: 13px; margin-top: 15px; }

        /* --- DASHBOARD --- */
        #app-view { display: none; width: 100%; height: 100%; flex-direction: column; }
        
        /* Mobile-First Sidebar (Now a Top Bar on phone / Sidebar on Desktop) */
        aside {
            background: white; border-bottom: 1px solid var(--border);
            padding: 15px; display: flex; flex-direction: column; gap: 15px;
            max-height: 40vh; overflow-y: auto; z-index: 10;
        }
        
        @media (min-width: 768px) {
            #app-view { flex-direction: row; }
            aside { width: 340px; border-right: 1px solid var(--border); border-bottom: none; max-height: 100vh; }
        }

        .brand { font-size: 18px; font-weight: 700; color: var(--primary); display: flex; justify-content: space-between; align-items: center; }
        .credit-badge { font-size: 13px; background: #eff6ff; color: var(--accent); padding: 5px 12px; border-radius: 20px; font-weight: 600; }

        .control-group h3 { font-size: 11px; text-transform: uppercase; color: #64748b; margin: 0 0 8px 0; letter-spacing: 0.5px; font-weight: 700; }
        
        .upload-btn {
            border: 2px dashed #cbd5e1; border-radius: 8px; padding: 15px;
            text-align: center; cursor: pointer; color: #64748b; font-size: 14px; display: block;
        }
        
        .row { display: flex; gap: 10px; margin-bottom: 10px; }
        label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 4px; color: #334155; }
        input[type="text"], input[type="number"], select {
            width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 6px;
            font-size: 14px; color: #0f172a; background: #fff;
        }
        
        /* Canvas Area - Optimized for Phone */
        main {
            flex: 1; background: #e2e8f0; display: flex; 
            align-items: flex-start; justify-content: center; overflow-y: auto; padding: 20px;
        }
        
        /* THE FIX: Canvas takes full width but maintains ratio */
        canvas { 
            background: white; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.1); 
            width: 100%; 
            height: auto; 
            max-width: 800px; /* Limit width on desktop */
            display: block;
        }

        /* Modal */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 100;
            display: none; align-items: center; justify-content: center;
        }
        .modal-box { background: white; padding: 20px; border-radius: 12px; width: 85%; max-width: 320px; text-align: center; }
        .preview-thumb { max-width: 100%; max-height: 200px; object-fit: contain; margin: 15px 0; border: 1px solid #eee; border-radius: 4px; }

    </style>
</head>
<body>

    <div id="login-view">
        <div class="auth-card">
            <h2 style="margin: 0 0 5px 0;">Hakimi Pro</h2>
            <p style="color: #64748b; font-size: 14px; margin: 0 0 20px 0;">Authentication Required</p>
            
            <form onsubmit="handleLogin(event)">
                <input type="email" id="email" class="auth-inp" placeholder="Email address" required>
                <input type="password" id="password" class="auth-inp" placeholder="Password" required>
                <button type="submit" class="btn-primary">Sign In</button>
            </form>
            
            <div style="margin-top: 15px; font-size: 13px;">
                <a href="#" onclick="handleSignup(event)" style="color: var(--accent); text-decoration: none;">New User? Create account</a>
            </div>
            <div id="auth-error" class="error-msg"></div>
        </div>
    </div>

    <div id="app-view">
        <aside>
            <div class="brand">
                <span>Hakimi Tools</span>
                <span id="credit-display" class="credit-badge">...</span>
            </div>

            <div class="control-group">
                <h3>1. Source</h3>
                <input type="file" id="file-in" hidden accept="image/*">
                <label for="file-in" class="upload-btn">
                    <strong>Upload File</strong> (4 Credits)
                </label>
                <div style="display:flex; gap:5px; margin-top:10px;">
                    <input type="text" id="link-in" placeholder="Paste Link...">
                    <button onclick="handleLink()" style="background:#334155; color:white; border:none; border-radius:6px; padding:0 15px;">GO</button>
                </div>
            </div>

            <div class="control-group">
                <h3>2. Dimensions</h3>
                <div class="row">
                    <div style="flex:1"><label>Split W</label><input type="text" id="sW" placeholder="55, 55" oninput="draw()"></div>
                    <div style="flex:1"><label>Split H</label><input type="text" id="sH" placeholder="90" oninput="draw()"></div>
                </div>
            </div>

            <div class="control-group">
                <h3>3. Settings</h3>
                <div class="row">
                    <div style="flex:1"><label>Total W</label><input type="number" id="tW" placeholder="110" oninput="draw()"></div>
                    <div style="flex:1"><label>Total H</label><input type="number" id="tH" placeholder="90" oninput="draw()"></div>
                </div>
                <div class="row">
                    <div style="flex:1"><label>Color</label><input type="color" id="clr" value="#ffffff" style="width:100%; height:40px; padding:2px;" oninput="draw()"></div>
                    <div style="flex:1"><label>Gap</label><input type="number" id="gap" placeholder="2" oninput="draw()"></div>
                </div>
                <label>Shape</label>
                <select id="shp" onchange="draw()">
                    <option value="rect">Rectangle</option>
                    <option value="circle">Circle</option>
                    <option value="arch-top">Arch Top</option>
                    <option value="arch-bottom">Arch Bottom</option>
                </select>
            </div>

            <button class="btn-primary" onclick="downloadCanvas()">Download Preview</button>
            <button onclick="auth.signOut()" style="background:none; border:none; color:#ef4444; font-size:12px; margin-top:10px;">Logout</button>
        </aside>

        <main>
            <canvas id="main-canvas"></canvas>
        </main>
    </div>

    <div id="modal" class="modal-overlay">
        <div class="modal-box">
            <h3 style="margin:0;">Confirm Load</h3>
            <img id="modal-img" class="preview-thumb">
            <p>Cost: <b style="color:#dc2626">4 Credits</b></p>
            <div class="row">
                <button onclick="closeModal(false)" style="flex:1; padding:12px; background:#f1f5f9; border:none; border-radius:8px;">Cancel</button>
                <button onclick="closeModal(true)" style="flex:1; padding:12px; background:var(--accent); color:white; border:none; border-radius:8px;">Confirm</button>
            </div>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="app.js"></script>
</body>
</html>
