<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hakimi Pro v33 - Deep Debug</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>

    <style>
        /* --- DEBUG OVERLAY (Always on Top) --- */
        #debug-console {
            position: fixed; top: 0; left: 0; width: 100%; height: 120px;
            background: rgba(50, 0, 0, 0.95); color: #00ff00;
            font-family: monospace; font-size: 10px; padding: 10px;
            z-index: 999999; overflow-y: scroll; border-bottom: 2px solid red;
            pointer-events: none; /* Let clicks pass through */
        }
        .log-err { color: #ff9999; font-weight: bold; border-bottom: 1px solid #550000; }
        .log-warn { color: yellow; }

        /* --- DARK THEME BASE --- */
        :root { --bg: #000; --panel: #1a1a1a; --text: #eee; --acc: #bb86fc; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: var(--bg); color: var(--text); font-family: sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        /* --- LOGIN SCREEN --- */
        #login-view { position: fixed; inset: 0; z-index: 5000; background: var(--bg); display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .auth-box { width: 300px; padding: 30px; background: var(--panel); border-radius: 12px; border: 1px solid #333; text-align: center; }
        
        .btn-google {
            width: 100%; padding: 15px; background: #4285F4; color: white; border: none; border-radius: 6px; 
            font-size: 16px; font-weight: bold; margin-top: 15px; cursor: pointer;
            transition: background 0.1s;
        }
        .btn-google:active { background: yellow; color: black; transform: scale(0.98); }

        /* --- APP LAYOUT (80/20) --- */
        #app-view { display: none; width: 100%; height: 100%; flex-direction: column; }
        
        /* Canvas (80%) */
        .canvas-area { height: 80vh; width: 100%; display: flex; justify-content: center; align-items: center; background: radial-gradient(circle, #222, #000); position: relative; }
        .canvas-wrapper { width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; padding: 10px; }
        canvas { background: white; max-width: 95%; max-height: 95%; box-shadow: 0 10px 40px #000; border: 1px solid #333; }
        
        /* Tools (20%) */
        .tools-area { height: 20vh; background: var(--panel); border-top: 1px solid #333; display: flex; align-items: center; overflow-x: auto; padding: 0 15px; gap: 20px; }
        .tool-btn { width: 50px; height: 50px; background: #333; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 22px; border: 1px solid #444; color: white; margin-bottom: 5px; flex-shrink: 0; }
        .tool-group { display: flex; flex-direction: column; align-items: center; min-width: 60px; }
        .tool-label { font-size: 10px; color: #aaa; }

        /* Helpers */
        .hidden-controls { display: none; }
        #modal { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 6000; display: none; justify-content: center; align-items: center; }
        .modal-box { background: var(--panel); padding: 20px; border-radius: 10px; width: 90%; max-width: 320px; text-align: center; border: 1px solid #444; }
    </style>
</head>
<body>

    <div id="debug-console">waiting for logs...<br></div>

    <div class="hidden-controls">
        <input type="file" id="fInput">
        <input type="number" id="tW" value="100"><input type="number" id="tH" value="90">
        <input type="text" id="sW"><input type="text" id="sH"><input type="number" id="gap" value="2">
        <select id="shp"><option value="rect">Rect</option><option value="circle">Circle</option><option value="arch-top">Arch Top</option><option value="arch-bottom">Arch Bottom</option></select>
        <input type="range" id="zoom" min="0.1" max="3" step="0.1" value="1">
        <input type="checkbox" id="mirror"><select id="fitMode"><option value="cover">Cover</option><option value="stretch">Stretch</option><option value="contain">Contain</option></select>
        <input type="color" id="clr" value="#ffffff">
    </div>

    <div id="login-view">
        <div class="auth-box">
            <h2 style="color:#fff; margin:0;">Hakimi Pro</h2>
            <p style="color:#666; font-size:12px;">v33 Debug</p>
            
            <button class="btn-google" id="btnLogin" onclick="debugLogin()">
                <span>📂</span> Sign in with Google
            </button>
            
            <div id="login-status" style="margin-top:15px; font-size:12px; color:yellow; min-height:20px;"></div>
        </div>
    </div>

    <div id="app-view">
        <div class="canvas-area">
            <div style="position:absolute; top:10px; left:10px; color:#fff; font-size:12px; background:rgba(0,0,0,0.5); padding:5px 10px; border-radius:15px;" id="userName">Guest</div>
            <div style="position:absolute; top:10px; right:10px; color:#000; font-size:12px; background:#bb86fc; padding:5px 10px; border-radius:15px; font-weight:bold;" id="creditDisplay">...</div>
            <div class="canvas-wrapper"><canvas id="cvs"></canvas></div>
        </div>
        <div class="tools-area">
            <div class="tool-group" onclick="handleUploadClick()"><div class="tool-btn" style="background:#fff; color:#000;">📂</div><span class="tool-label">Upload</span></div>
            <div class="tool-group" onclick="promptVal('tW','Width')"><div class="tool-btn">↔️</div><span class="tool-label">Width</span></div>
            <div class="tool-group" onclick="promptVal('tH','Height')"><div class="tool-btn">↕️</div><span class="tool-label">Height</span></div>
            <div class="tool-group" onclick="cycleZoom()"><div class="tool-btn">🔍</div><span class="tool-label" id="lbl-zoom">1.0x</span></div>
            <div class="tool-group" onclick="cycleFit()"><div class="tool-btn">🖼️</div><span class="tool-label" id="lbl-fit">Cover</span></div>
            <div class="tool-group" onclick="toggleMirror()"><div class="tool-btn">🪞</div><span class="tool-label">Flip</span></div>
            <div class="tool-group" onclick="cycleShape()"><div class="tool-btn">⬜</div><span class="tool-label" id="lbl-shape">Rect</span></div>
            <div class="tool-group"><div class="tool-btn" style="position:relative;"><input type="color" oninput="updateColor(this.value)" style="position:absolute;opacity:0;width:100%;height:100%;"><div style="pointer-events:none;">🎨</div></div><span class="tool-label">Color</span></div>
            
            <div class="tool-group" id="btn-lock" onclick="unlockPro()"><div class="tool-btn" style="border-color:var(--acc); color:var(--acc);">🔓</div><span class="tool-label" style="color:var(--acc);">Unlock</span></div>
            <div id="pro-grp" style="display:none; gap:15px;">
                <div class="tool-group" onclick="promptVal('sW','Split W')"><div class="tool-btn" style="border-color:var(--acc); color:var(--acc);">✂️</div><span class="tool-label" style="color:var(--acc);">Split W</span></div>
                <div class="tool-group" onclick="promptVal('sH','Split H')"><div class="tool-btn" style="border-color:var(--acc); color:var(--acc);">➗</div><span class="tool-label" style="color:var(--acc);">Split H</span></div>
                <div class="tool-group" onclick="promptVal('gap','Gap')"><div class="tool-btn" style="border-color:var(--acc); color:var(--acc);">Gap</div><span class="tool-label" style="color:var(--acc);">Gap</span></div>
            </div>

            <div class="tool-group" onclick="downloadCanvas()"><div class="tool-btn">⬇️</div><span class="tool-label">Save</span></div>
            <div class="tool-group" onclick="auth.signOut()"><div class="tool-btn" style="background:#500;">X</div><span class="tool-label">Exit</span></div>
        </div>
    </div>

    <div id="modal">
        <div class="modal-box">
            <h3 style="color:#fff">Confirm Image</h3>
            <img id="modal-img" style="max-width:100%; height:150px; object-fit:contain; background:#000;">
            <p style="color:#aaa">Cost: <b style="color:var(--acc)">4 Credits</b></p>
            <button onclick="closeModal(true)" style="width:100%; padding:10px; background:var(--acc); border:none; border-radius:5px; font-weight:bold;">Confirm</button>
            <button onclick="closeModal(false)" style="width:100%; padding:10px; background:#333; color:#fff; border:none; border-radius:5px; margin-top:5px;">Cancel</button>
        </div>
    </div>

    <script>
        // --- LOGGER (Captures EVERYTHING) ---
        var consoleBox = document.getElementById('debug-console');
        function log(msg, type) {
            var line = document.createElement('div');
            line.className = type === 'error' ? 'log-err' : (type==='warn'?'log-warn':'');
            line.innerText = "> " + msg;
            consoleBox.appendChild(line);
            consoleBox.scrollTop = consoleBox.scrollHeight;
            console.log(msg); // Also print to real console
        }
        
        window.onerror = function(msg, url, line) { log("CRITICAL JS ERROR (L"+line+"): " + msg, 'error'); };
        window.addEventListener('unhandledrejection', function(e) { log("PROMISE FAIL: " + e.reason, 'error'); });

        // --- FIREBASE CONFIG ---
        var firebaseConfig = {
            apiKey: "AIzaSyBup3s_Z3nVZU-O5da0owglWaFXh5Fpfdg",
            authDomain: "customise-previews.firebaseapp.com",
            projectId: "customise-previews",
            storageBucket: "customise-previews.firebasestorage.app",
            messagingSenderId: "1073406972228",
            appId: "1:1073406972228:web:71ee5db786b2fe2af40711"
        };

        var db, auth, currentUser, currentImg, tempSrc, uploadedFileName;
        var imgState = { x: 0, y: 0, zoom: 1.0, isDragging: false, lastX: 0, lastY: 0 };

        try {
            log("Initializing Firebase...");
            if(typeof firebase === 'undefined') throw new Error("Firebase SDK not loaded!");
            firebase.initializeApp(firebaseConfig);
            db = firebase.firestore();
            auth = firebase.auth();
            log("Firebase Loaded OK.");
        } catch(e) { log("SETUP ERROR: " + e.message, 'error'); }


        // --- LOGIN DEBUGGER ---
        function debugLogin() {
            var btn = document.getElementById('btnLogin');
            var stat = document.getElementById('login-status');
            
            // Visual Feedback
            btn.style.background = "yellow";
            btn.style.color = "black";
            btn.innerText = "Processing...";
            log("Button Touched. Starting Login process...");

            if(!auth) {
                log("FAIL: Auth object missing. Firebase didn't load.", 'error');
                stat.innerText = "Error: Firebase not loaded.";
                return;
            }

            var provider = new firebase.auth.GoogleAuthProvider();
            
            // Try Redirect (Better for Mobile)
            log("Attempting Redirect Login...");
            auth.signInWithRedirect(provider).catch(function(err){
                log("LOGIN ERROR: " + err.code + " | " + err.message, 'error');
                stat.innerText = err.message;
                btn.style.background = "red";
                btn.style.color = "white";
                btn.innerText = "Retry Sign In";
            });
        }

        // --- AUTH LISTENER ---
        if(auth) {
            // Check for redirect result (when returning from Google)
            auth.getRedirectResult().then(function(result) {
                if (result.user) log("Redirect Login Successful: " + result.user.email);
            }).catch(function(error) {
                log("Redirect Result Error: " + error.code, 'error');
            });

            auth.onAuthStateChanged(function(user) {
                if(user) {
                    log("User Authenticated: " + user.email);
                    currentUser = user;
                    document.getElementById('login-view').style.display = 'none';
                    document.getElementById('app-view').style.display = 'flex';
                    document.getElementById('userName').innerText = (user.displayName||user.email).split(' ')[0];
                    
                    db.collection('users').doc(user.uid).onSnapshot(function(doc){
                        if(!doc.exists) db.collection('users').doc(user.uid).set({email:user.email, credits:10});
                        else document.getElementById('creditDisplay').innerText = (doc.data().credits||0) + " Cr";
                    });
                    setTimeout(draw, 500);
                } else {
                    log("No User Signed In. Showing Login Screen.");
                    document.getElementById('login-view').style.display = 'flex';
                    document.getElementById('app-view').style.display = 'none';
                }
            });
        }

        // --- APP LOGIC BRIDGE ---
        function promptVal(id, txt) { var v=prompt(txt, document.getElementById(id).value); if(v!==null){document.getElementById(id).value=v; draw();} }
        function cycleZoom() { var el=document.getElementById('zoom'); var v=parseFloat(el.value); v=(v>=3)?0.5:v+0.5; el.value=v; document.getElementById('lbl-zoom').innerText=v+"x"; draw(); }
        function cycleFit() { var el=document.getElementById('fitMode'); var o=['cover','stretch','contain']; el.value=o[(o.indexOf(el.value)+1)%3]; document.getElementById('lbl-fit').innerText=el.value; draw(); }
        function toggleMirror() { var el=document.getElementById('mirror'); el.checked=!el.checked; draw(); }
        function cycleShape() { var el=document.getElementById('shp'); var o=['rect','circle','arch-top','arch-bottom']; el.value=o[(o.indexOf(el.value)+1)%4]; document.getElementById('lbl-shape').innerText=el.value.replace('-',' '); draw(); }
        function updateColor(v) { document.getElementById('clr').value=v; draw(); }

        function handleUploadClick() {
            document.getElementById('fInput').click();
            document.getElementById('btn-lock').style.display = 'flex';
            document.getElementById('pro-grp').style.display = 'none';
            document.getElementById('sW').value=''; document.getElementById('sH').value='';
        }
        
        function unlockPro() {
            if(!currentUser) return;
            var btn = document.getElementById('btn-lock');
            btn.querySelector('.tool-label').innerText = "...";
            var ref = db.collection('users').doc(currentUser.uid);
            db.runTransaction(function(t){
                return t.get(ref).then(function(doc){
                    var c = doc.data().credits || 0;
                    if(c < 2) throw "Need 2 Credits";
                    t.update(ref, { credits: c - 2 });
                });
            }).then(function(){
                btn.style.display = 'none';
                document.getElementById('pro-grp').style.display = 'flex';
                document.getElementById('gap').value='2'; draw();
            }).catch(function(e){ alert(e); btn.querySelector('.tool-label').innerText = "Unlock"; });
        }

        // --- CANVAS LOGIC ---
        var cvs = document.getElementById('cvs');
        function getV(id){ return parseFloat(document.getElementById(id).value)||0; }

        document.getElementById('fInput').addEventListener('change', function(e) {
            if(e.target.files[0]) {
                var file = e.target.files[0];
                uploadedFileName = file.name.split('.')[0];
                var reader = new FileReader();
                reader.onload = function(evt) {
                    tempSrc = evt.target.result;
                    document.getElementById('modal-img').src = tempSrc;
                    document.getElementById('modal').style.display = 'flex';
                };
                reader.readAsDataURL(file);
                e.target.value = '';
            }
        });

        function closeModal(pay) {
            document.getElementById('modal').style.display = 'none';
            if(pay && tempSrc) {
                var ref = db.collection('users').doc(currentUser.uid);
                db.runTransaction(function(t){
                    return t.get(ref).then(function(doc){
                        var c = doc.data().credits || 0;
                        if(c < 4) throw "Low Balance";
                        t.update(ref, { credits: c - 4 });
                    });
                }).then(function(){
                    var img = new Image();
                    img.onload = function(){
                        currentImg = img; imgState={x:0, y:0, zoom:1.0};
                        document.getElementById('zoom').value=1.0; draw();
                    };
                    img.src = tempSrc;
                }).catch(function(e){ alert(e); });
            }
        }

        // Dragging
        function startDrag(e){ imgState.isDragging=true; imgState.lastX=e.touches?e.touches[0].clientX:e.clientX; imgState.lastY=e.touches?e.touches[0].clientY:e.clientY; }
        function doDrag(e){
            if(!imgState.isDragging) return;
            e.preventDefault();
            var cx=e.touches?e.touches[0].clientX:e.clientX; var cy=e.touches?e.touches[0].clientY:e.clientY;
            imgState.x += (cx - imgState.lastX); imgState.y += (cy - imgState.lastY);
            imgState.lastX = cx; imgState.lastY = cy;
            draw();
        }
        function stopDrag(){ imgState.isDragging=false; }
        cvs.addEventListener('mousedown', startDrag); window.addEventListener('mousemove', doDrag); window.addEventListener('mouseup', stopDrag);
        cvs.addEventListener('touchstart', startDrag); window.addEventListener('touchmove', doDrag); window.addEventListener('touchend', stopDrag);

        function draw() {
            var ctx = cvs.getContext('2d');
            var tW=getV('tW')||100, tH=getV('tH')||90, gap=getV('gap')||0;
            var sW=document.getElementById('sW').value, sH=document.getElementById('sH').value;
            var cols=sW?sW.split(',').map(Number):[tW], rows=sH?sH.split(',').map(Number):[tH];
            
            var HD=1500; cvs.width=HD; cvs.height=HD;
            var vW=cols.reduce((a,b)=>a+b,0)+(cols.length-1)*gap;
            var vH=rows.reduce((a,b)=>a+b,0)+(rows.length-1)*gap;
            var pad=100, safeW=HD-2*pad, safeH=HD-2*pad;
            var PPI=Math.min(safeW/vW, safeH/vH);
            var startX=pad+(safeW-vW*PPI)/2, startY=pad+(safeH-vH*PPI)/2;
            
            ctx.fillStyle = "white"; ctx.fillRect(0,0,HD,HD);
            var cY=startY;
            rows.forEach(function(h, rI){
                var cX=startX;
                var rShp=document.getElementById('shp').value;
                if(rShp.includes('arch') && rI!==0 && rI!==rows.length-1) rShp='rect';
                cols.forEach(function(w){
                    var dW=w*PPI, dH=h*PPI;
                    ctx.save();
                    ctx.beginPath(); trace(ctx,cX,cY,dW,dH,rShp,PPI); ctx.clip();
                    ctx.fillStyle=document.getElementById('clr').value; ctx.fill();
                    
                    if(currentImg) {
                        ctx.save();
                        var centerX=cX+dW/2, centerY=cY+dH/2;
                        ctx.translate(centerX+imgState.x, centerY+imgState.y);
                        ctx.scale(imgState.zoom, imgState.zoom);
                        if(document.getElementById('mirror').checked) ctx.scale(-1,1);
                        var scale=Math.max(dW/currentImg.width, dH/currentImg.height);
                        if(document.getElementById('fitMode').value==='stretch') ctx.drawImage(currentImg, -dW/2, -dH/2, dW, dH);
                        else { var dw=currentImg.width*scale, dh=currentImg.height*scale; ctx.drawImage(currentImg, -dw/2, -dh/2, dw, dh); }
                        ctx.restore();
                    }
                    ctx.restore();
                    ctx.strokeStyle="#333"; ctx.lineWidth=4; ctx.beginPath(); trace(ctx,cX,cY,dW,dH,rShp,PPI); ctx.stroke();
                    ctx.fillStyle="#333"; ctx.font="bold 60px sans-serif"; ctx.textAlign="center";
                    ctx.fillText(w+'"', cX+dW/2, cY+dH+70);
                    ctx.save(); ctx.translate(cX-30, cY+dH/2); ctx.rotate(-Math.PI/2); ctx.fillText(h+'"', 0,0); ctx.restore();
                    cX+=dW+gap*PPI;
                });
                cY+=h*PPI+gap*PPI;
            });
        }
        function trace(ctx,x,y,w,h,t,p){
            var d=Math.min(h,10*p);
            if(t==='rect') ctx.rect(x,y,w,h);
            else if(t==='circle') ctx.ellipse(x+w/2,y+h/2,w/2,h/2,0,0,2*Math.PI);
            else if(t==='arch-top'){ctx.moveTo(x,y+h);ctx.lineTo(x,y+d);ctx.bezierCurveTo(x,y,x+w,y,x+w,y+d);ctx.lineTo(x+w,y+h);}
            else if(t==='arch-bottom'){ctx.moveTo(x,y);ctx.lineTo(x+w,y);ctx.lineTo(x+w,y+h-d);ctx.bezierCurveTo(x+w,y+h,x,y+h,x,y+h-d);ctx.lineTo(x,y);}
            ctx.closePath();
        }
        function downloadCanvas(){var a=document.createElement('a'); a.download='hakimi-'+(uploadedFileName||'design')+'.png'; a.href=cvs.toDataURL(); a.click();}
    </script>
</body>
</html>
