<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hakimi Pro | Google Login</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>

    <style>
        /* CSS RESET */
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #eee; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

        /* DEBUG BAR */
        #status-bar { background: #333; color: white; font-size: 11px; padding: 5px; text-align: center; display: none; }

        /* LOGIN SCREEN */
        #login-view { position: fixed; inset: 0; z-index: 50; background: white; display: flex; justify-content: center; align-items: center; }
        .auth-box { width: 300px; padding: 30px; text-align: center; }
        
        /* GOOGLE BTN */
        .btn-google {
            width: 100%; padding: 12px; background: #4285F4; color: white; 
            border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 16px;
            display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        .btn-google:hover { background: #357ae8; }

        /* APP LAYOUT */
        #app-view { display: none; width: 100%; height: 100%; flex-direction: column; }
        
        aside { background: white; padding: 15px; border-bottom: 1px solid #ccc; display: flex; flex-direction: column; gap: 10px; max-height: 40vh; overflow-y: auto; }
        @media (min-width: 768px) {
            #app-view { flex-direction: row; }
            aside { width: 320px; border-right: 1px solid #ccc; border-bottom: none; max-height: 100vh; }
        }

        main { flex: 1; background: #e5e5e5; display: flex; justify-content: center; align-items: flex-start; padding: 20px; overflow: auto; }
        canvas { background: white; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-width: 100%; }

        /* CONTROLS */
        .row { display: flex; gap: 10px; }
        .btn-upload { border: 2px dashed #ccc; padding: 15px; text-align: center; color: #666; font-weight: bold; cursor: pointer; display: block; border-radius: 6px; }
        input[type="text"], input[type="number"], select { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        .btn-black { width: 100%; padding: 12px; background: black; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div id="status-bar"></div>

    <div id="login-view">
        <div class="auth-box">
            <h2 style="margin-top:0;">Hakimi Pro</h2>
            <p style="color:#666; margin-bottom:30px;">Login to access tools</p>
            
            <button class="btn-google" onclick="googleLogin()">
                <span>🔵</span> Sign in with Google
            </button>
            <p id="login-msg" style="color:red; font-size:12px; margin-top:20px;"></p>
        </div>
    </div>

    <div id="app-view">
        <aside>
            <div style="display:flex; justify-content:space-between;">
                <strong>Hakimi Tools</strong>
                <span id="credit-display" style="color:blue;">...</span>
            </div>

            <input type="file" id="fInput" hidden>
            <div class="btn-upload" onclick="document.getElementById('fInput').click()">
                📁 Upload Image (4 Credits)
            </div>

            <div class="row">
                <input id="sW" placeholder="Widths (55, 55)" oninput="draw()">
                <input id="sH" placeholder="Heights (90)" oninput="draw()">
            </div>
            <div class="row">
                <input id="tW" placeholder="Total W (110)" oninput="draw()">
                <input id="tH" placeholder="Total H (90)" oninput="draw()">
            </div>
            <div class="row">
                <input id="gap" placeholder="Gap (2)" oninput="draw()">
                <input type="color" id="clr" value="#ffffff" oninput="draw()" style="height:35px;">
            </div>
            <select id="shp" onchange="draw()">
                <option value="rect">Rectangle</option>
                <option value="circle">Circle</option>
                <option value="arch-top">Arch Top</option>
                <option value="arch-bottom">Arch Bottom</option>
            </select>

            <button class="btn-black" onclick="downloadCanvas()">Download Preview</button>
            <button onclick="auth.signOut()" style="background:none; border:none; color:red; cursor:pointer; margin-top:10px;">Logout</button>
        </aside>

        <main>
            <canvas id="cvs"></canvas>
        </main>
    </div>

    <script>
        // --- 1. PASTE KEYS HERE ---
        var firebaseConfig = {
            apiKey: "AIzaSyBup3s_Z3nVZU-O5da0owglWaFXh5Fpfdg",
  authDomain: "customise-previews.firebaseapp.com",
  projectId: "customise-previews",
  storageBucket: "customise-previews.firebasestorage.app",
  messagingSenderId: "1073406972228",
  appId: "1:1073406972228:web:71ee5db786b2fe2af40711"
        };
        // --------------------------

        // GLOBAL VARS
        var db, auth, currentUser, currentImg;

        // INIT FIREBASE
        try {
            if (!firebase.apps.length) {
                firebase.initializeApp(firebaseConfig);
            }
            db = firebase.firestore();
            auth = firebase.auth();
        } catch (e) {
            alert("Config Error: " + e.message);
        }

        // AUTH LISTENER
        if (auth) {
            auth.onAuthStateChanged(function(user) {
                if (user) {
                    currentUser = user;
                    document.getElementById('login-view').style.display = 'none';
                    document.getElementById('app-view').style.display = 'flex';
                    
                    // Sync Credits
                    db.collection('users').doc(user.uid).onSnapshot(function(doc) {
                        if (!doc.exists) {
                            db.collection('users').doc(user.uid).set({email: user.email, credits: 10});
                        } else {
                            var c = doc.data().credits || 0;
                            document.getElementById('credit-display').innerText = c + " Credits";
                        }
                    });
                    setTimeout(draw, 500);
                } else {
                    document.getElementById('login-view').style.display = 'flex';
                    document.getElementById('app-view').style.display = 'none';
                }
            });
        }

        // GOOGLE LOGIN FUNCTION
        function googleLogin() {
            var provider = new firebase.auth.GoogleAuthProvider();
            document.getElementById('login-msg').innerText = "Opening popup...";
            
            auth.signInWithPopup(provider).catch(function(error) {
                document.getElementById('login-msg').innerText = error.message;
                console.error(error);
            });
        }

        // IMAGE LOGIC
        document.getElementById('fInput').addEventListener('change', function(e) {
            if (e.target.files[0]) {
                if(!confirm("Spend 4 Credits to load?")) return;

                var ref = db.collection('users').doc(currentUser.uid);
                
                db.runTransaction(function(t) {
                    return t.get(ref).then(function(doc) {
                        var c = doc.data().credits || 0;
                        if (c < 4) throw "Insufficient Credits";
                        t.update(ref, { credits: c - 4 });
                    });
                }).then(function() {
                    var r = new FileReader();
                    r.onload = function(evt) {
                        var img = new Image();
                        img.onload = function() {
                            currentImg = img;
                            // Safe Auto Color
                            try {
                                var c = document.createElement('canvas'); c.width=1; c.height=1;
                                c.getContext('2d').drawImage(img,0,0,1,1);
                                var p = c.getContext('2d').getImageData(0,0,1,1).data;
                                var hex = "#" + ((1<<24)+(p[0]<<16)+(p[1]<<8)+p[2]).toString(16).slice(1);
                                document.getElementById('clr').value = hex;
                            } catch(e){}
                            draw();
                        };
                        img.src = evt.target.result;
                    };
                    r.readAsDataURL(e.target.files[0]);
                }).catch(function(err) {
                    alert("Error: " + err);
                });
            }
        });

        // DRAW ENGINE
        function getV(id) {
            var el = document.getElementById(id);
            return parseFloat(el.value || el.placeholder) || 0;
        }

        function draw() {
            var cvs = document.getElementById('cvs');
            var ctx = cvs.getContext('2d');
            
            var tW = getV('tW'), tH = getV('tH'), gap = getV('gap');
            var clr = document.getElementById('clr').value;
            var shp = document.getElementById('shp').value;

            var sW_txt = document.getElementById('sW').value || "55, 55";
            var sH_txt = document.getElementById('sH').value || "90";
            
            var cols = sW_txt.split(',').map(Number).filter(function(n){ return n>0 });
            var rows = sH_txt.split(',').map(Number).filter(function(n){ return n>0 });
            
            var fCols = cols.length ? cols : [tW];
            var fRows = rows.length ? rows : [tH];
            
            var PPI = 5; 
            var P = 20;
            
            var gW = fCols.reduce(function(a,b){ return a+b }, 0);
            var gH = fRows.reduce(function(a,b){ return a+b }, 0);
            
            var vW = gW + ((fCols.length-1)*gap);
            var vH = gH + ((fRows.length-1)*gap);
            
            cvs.width = (vW*PPI) + (P*2);
            cvs.height = (vH*PPI) + (P*2);

            ctx.fillStyle = "white"; 
            ctx.fillRect(0,0,cvs.width, cvs.height);
            
            var cY = P;
            var accH = 0;

            fRows.forEach(function(h, rI) {
                var cX = P; 
                var accW = 0;
                var rShp = shp;
                if(shp.indexOf('arch') > -1) {
                    if(shp==='arch-top' && rI!==0) rShp='rect';
                    if(shp==='arch-bottom' && rI!==fRows.length-1) rShp='rect';
                }

                fCols.forEach(function(w, cI) {
                    var dW = w*PPI; 
                    var dH = h*PPI;
                    
                    ctx.save();
                    ctx.beginPath(); 
                    trace(ctx, cX, cY, dW, dH, rShp, PPI); 
                    ctx.clip();
                    
                    ctx.fillStyle = clr; 
                    ctx.fill();
                    
                    if(currentImg) {
                        ctx.drawImage(currentImg, P-(accW*PPI), P-(accH*PPI), (tW*PPI), (tH*PPI)); 
                    }
                    ctx.restore();
                    
                    ctx.lineWidth=2; 
                    ctx.strokeStyle="#333";
                    ctx.beginPath(); 
                    trace(ctx, cX, cY, dW, dH, rShp, PPI); 
                    ctx.stroke();
                    
                    ctx.fillStyle="black"; 
                    ctx.font="bold 13px Arial"; 
                    ctx.textAlign="center";
                    ctx.fillText(w+'"', cX+dW/2, cY+dH+15);
                    
                    ctx.save(); 
                    ctx.translate(cX-10, cY+dH/2); 
                    ctx.rotate(-Math.PI/2);
                    ctx.fillText(h+'"', 0, 0); 
                    ctx.restore();

                    cX += dW + (gap*PPI); 
                    accW += w;
                });
                cY += (h*PPI) + (gap*PPI);
                accH += h;
            });
        }

        function trace(ctx, x, y, w, h, t, p) {
            var d = Math.min(h, 10*p);
            if(t==='rect') ctx.rect(x,y,w,h);
            else if(t==='circle') ctx.ellipse(x+w/2, y+h/2, w/2, h/2, 0, 0, 2*Math.PI);
            else if(t==='arch-top') {
                ctx.moveTo(x,y+h); ctx.lineTo(x,y+d); 
                ctx.bezierCurveTo(x,y, x+w,y, x+w,y+d); ctx.lineTo(x+w,y+h);
            } else if(t==='arch-bottom') {
                ctx.moveTo(x,y); ctx.lineTo(x+w,y); ctx.lineTo(x+w,y+h-d);
                ctx.bezierCurveTo(x+w,y+h, x,y+h, x,y+h-d); ctx.lineTo(x,y);
            }
            ctx.closePath();
        }

        function downloadCanvas() {
            var a = document.createElement('a');
            a.download = 'hakimi-preview.png';
            a.href = document.getElementById('cvs').toDataURL();
            a.click();
        }
    </script>
</body>
</html>
