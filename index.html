<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hakimi Pro</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root { --primary: #0f172a; --accent: #2563eb; --bg: #f8fafc; --border: #e2e8f0; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); margin: 0; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

        /* LOGIN SCREEN */
        #login-view {
            position: fixed; inset: 0; z-index: 50; background: rgba(255,255,255,0.95);
            display: flex; align-items: center; justify-content: center; padding: 20px;
        }
        .auth-card {
            background: white; width: 100%; max-width: 360px; padding: 40px 30px;
            border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); border: 1px solid var(--border);
            text-align: center;
        }
        .auth-inp {
            width: 100%; padding: 12px; margin-bottom: 12px; border: 1px solid var(--border);
            border-radius: 8px; font-size: 16px; background: #f8fafc;
        }
        .btn-auth {
            width: 100%; padding: 12px; background: var(--primary); color: white;
            border: none; border-radius: 8px; font-weight: 600; font-size: 16px; margin-top: 5px; cursor: pointer;
        }
        .error-log { color: #dc2626; font-size: 13px; margin-top: 15px; min-height: 18px; }

        /* DASHBOARD LAYOUT */
        #app-view { display: none; width: 100%; height: 100%; flex-direction: column; }

        /* Sidebar / Topbar */
        aside {
            background: white; border-bottom: 1px solid var(--border);
            padding: 15px; display: flex; flex-direction: column; gap: 15px;
            max-height: 40vh; overflow-y: auto; z-index: 10;
        }
        
        @media (min-width: 768px) {
            #app-view { flex-direction: row; }
            aside { width: 320px; border-right: 1px solid var(--border); border-bottom: none; max-height: 100vh; }
        }

        .header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
        .badge { font-size: 12px; background: #eff6ff; color: var(--accent); padding: 4px 10px; border-radius: 20px; font-weight: 600; }
        
        .upload-box {
            border: 2px dashed #cbd5e1; border-radius: 8px; padding: 15px; text-align: center;
            color: #64748b; font-size: 14px; cursor: pointer; font-weight: 500;
        }

        .row { display: flex; gap: 10px; margin-bottom: 10px; }
        label { display: block; font-size: 11px; font-weight: 700; color: #64748b; margin-bottom: 4px; text-transform: uppercase; }
        
        input[type="text"], input[type="number"], select {
            width: 100%; padding: 8px; border: 1px solid var(--border); border-radius: 6px;
            font-size: 14px; color: #0f172a;
        }

        /* Canvas */
        main { flex: 1; background: #e2e8f0; display: flex; align-items: flex-start; justify-content: center; overflow: auto; padding: 20px; }
        canvas { background: white; box-shadow: 0 4px 20px rgba(0,0,0,0.1); width: 100%; max-width: 800px; height: auto; display: block; border-radius: 4px; }

        /* Modal */
        #modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 900; display: none; align-items: center; justify-content: center; }
        .modal-box { background: white; width: 85%; max-width: 350px; padding: 20px; border-radius: 12px; text-align: center; }
        .preview-img { max-width: 100%; height: 180px; object-fit: contain; margin: 15px 0; }
    </style>
</head>
<body>

    <div id="login-view">
        <div class="auth-card">
            <h2 style="margin:0 0 5px 0;">Hakimi Pro</h2>
            <p style="color:#64748b; font-size:14px; margin:0 0 25px 0;">Authentication Required</p>
            
            <form onsubmit="handleLogin(event)">
                <input type="email" id="email" class="auth-inp" placeholder="Email Address" required>
                <input type="password" id="password" class="auth-inp" placeholder="Password" required>
                <button type="submit" class="btn-auth">Sign In</button>
            </form>

            <button onclick="handleSignup(event)" style="width:100%; padding:12px; background:white; color:#333; border:1px solid #ddd; border-radius:8px; font-weight:600; margin-top:10px; cursor:pointer;">Create Account</button>
            
            <div id="auth-log" class="error-log"></div>
        </div>
    </div>

    <div id="app-view">
        <aside>
            <div class="header-row">
                <span style="font-weight:700; color:var(--primary);">Hakimi Tools</span>
                <div>
                    <span id="credit-badge" class="badge">...</span>
                    <button onclick="handleLogout()" style="border:none; background:none; color:#ef4444; font-size:12px; font-weight:600; cursor:pointer; margin-left:8px;">Logout</button>
                </div>
            </div>

            <div style="border-bottom:1px solid #f1f5f9; padding-bottom:15px;">
                <input type="file" id="file-in" hidden accept="image/*">
                <label for="file-in" class="upload-box">
                    📁 Upload File <span style="opacity:0.6; font-size:11px;">(4 Credits)</span>
                </label>
                <div style="display:flex; gap:5px; margin-top:10px;">
                    <input type="text" id="link-in" placeholder="Or paste link...">
                    <button onclick="handleLink()" style="background:#334155; color:white; border:none; border-radius:4px; padding:0 12px; cursor:pointer;">Go</button>
                </div>
            </div>

            <div>
                <label>Dimensions</label>
                <div class="row">
                    <div style="flex:1"><input type="text" id="sW" placeholder="Col Widths (55, 55)" oninput="draw()"></div>
                    <div style="flex:1"><input type="text" id="sH" placeholder="Row Heights (90)" oninput="draw()"></div>
                </div>
                <div class="row">
                    <div style="flex:1"><input type="number" id="tW" placeholder="Total W (110)" oninput="draw()"></div>
                    <div style="flex:1"><input type="number" id="tH" placeholder="Total H (90)" oninput="draw()"></div>
                </div>
            </div>

            <div>
                <label>Style</label>
                <div class="row">
                    <div style="flex:1"><input type="color" id="clr" value="#ffffff" style="width:100%; height:38px; padding:2px;" oninput="draw()"></div>
                    <div style="flex:1"><input type="number" id="gap" placeholder="Gap (2)" oninput="draw()"></div>
                </div>
                <select id="shp" onchange="draw()">
                    <option value="rect">Rectangle</option>
                    <option value="circle">Circle</option>
                    <option value="arch-top">Arch Top</option>
                    <option value="arch-bottom">Arch Bottom</option>
                </select>
            </div>

            <button onclick="downloadCanvas()" class="btn-auth" style="background:#16a34a; margin-top:10px;">Download Preview</button>
        </aside>

        <main>
            <canvas id="main-canvas"></canvas>
        </main>
    </div>

    <div id="modal">
        <div class="modal-box">
            <h3 style="margin-top:0;">Confirm Image</h3>
            <img id="modal-img" class="preview-img">
            <p>Cost: <b style="color:#dc2626">4 Credits</b></p>
            <div class="row">
                <button onclick="closeModal(false)" style="flex:1; padding:12px; background:#f1f5f9; border:none; border-radius:8px; cursor:pointer;">Cancel</button>
                <button onclick="closeModal(true)" style="flex:1; padding:12px; background:var(--accent); color:white; border:none; border-radius:8px; cursor:pointer;">Confirm</button>
            </div>
        </div>
    </div>

    <script src="/config.js"></script>
    <script src="/app.js"></script>
</body>
</html>
