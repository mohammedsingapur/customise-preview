<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hakimi Pro v27</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>

    <style>
        /* BASE STYLES */
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {height:90%,padding: 5%, font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f8f9fa; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

        /* ERROR BAR */
        #error-bar { background: #fee2e2; color: #b91c1c; padding: 10px; font-size: 12px; display: none; border-bottom: 1px solid red; font-family: monospace; }

        /* LOGIN SCREEN */
        #login-view { position: fixed; inset: 0; z-index: 50; background: white; display: flex; justify-content: center; align-items: center; }
        .auth-box { width: 300px; padding: 30px; text-align: center; }
        .btn-google {
            width: 100%; padding: 12px; background: #4285F4; color: white; 
            border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 16px;
            display: flex; align-items: center; justify-content: center; gap: 10px;
        }

        /* MAIN APP */
        #app-view { display: none; width: 100%; height: 100%; flex-direction: column; }
        
        aside { 
            background: white; padding: 20px; border-bottom: 1px solid #eee; 
            display: flex; flex-direction: column; gap: 12px; 
            max-height: 50vh; overflow-y: auto; z-index: 10; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        @media (min-width: 768px) {
            #app-view { flex-direction: row; }
            aside { width: 360px; border-right: 1px solid #eee; border-bottom: none; max-height: 100vh; }
        }

        /* CONTROLS */
        label { display: block; font-size: 11px; font-weight: 700; color: #4b5563; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
        input[type="text"], input[type="number"], select { 
            width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 6px; 
            font-size: 14px; background: #fff; margin-bottom: 5px;
        }
        .row { display: flex; gap: 10px; }
        .col { flex: 1; }
        
        .blue-box { background: #eff6ff; border: 1px solid #bfdbfe; padding: 12px; border-radius: 8px; margin-bottom: 5px; }
        
        .btn-upload { 
            border: 1px solid #d1d5db; padding: 12px; border-radius: 6px; cursor: pointer; 
            background: #fff; display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 600; color: #374151;
        }

        /* NEW CONTROLS */
        .check-row { display: flex; align-items: center; gap: 8px; margin-top: 5px; }
        input[type=range] { width: 100%; margin: 10px 0; }
        .check-row input { width: auto; }

        /* BUTTONS */
        .btn-black { width: 100%; padding: 14px; background: #111; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .btn-link { background: none; border: none; color: #dc2626; font-size: 12px; cursor: pointer; text-decoration: underline; margin-top: 5px; }

        /* CANVAS AREA - CSS FIXED FOR MOBILE */
                /* CANVAS AREA - MOBILE OPTIMIZED */
                /* CANVAS AREA - v2.0 STYLE FIX */
                /* CANVAS AREA - SCROLLABLE */
                /* CANVAS AREA - v2.0 STYLE FIX */
        main { 
            flex: 1; 
            background: #e5e5e5; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center;
            padding: 10px; 
            overflow: hidden; /* Prevents the page from scrolling */
            position: relative; 
        }

        .canvas-wrapper { 
            width: 100%; 
            height: 100%; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            overflow: hidden;
        }

                /* AUTO-FIT CANVAS STYLE */
        canvas { 
            background: white; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.2); 
            padding-bottom : 10%;
            
            /* VISUAL SIZE: Fits phone screen perfectly */
            max-width: 100%;
            max-height: 60vh; /* Keeps it visible without scrolling */
            width: auto;
            height: auto;
            
            /* INTERACTION */
            cursor: grab; 
            touch-action: none;
            object-fit: contain;
        }
        canvas:active { cursor: grabbing; }



        
        .drag-hint { background: rgba(0,0,0,0.1); padding: 5px 10px; border-radius: 20px; font-size: 12px; color: #666; margin-bottom: 10px; position: absolute; top: 10px; z-index: 5; pointer-events: none; }

        /* MODAL */
        #modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 100; display: none; justify-content: center; align-items: center; }
        .modal-box { background: white; width: 85%; max-width: 320px; padding: 20px; border-radius: 12px; text-align: center; }
        .modal-img { max-width: 100%; height: 180px; object-fit: contain; margin: 15px 0; border: 1px solid #eee; }
        .btn-confirm { width: 100%; padding: 12px; background: #2563eb; color: white; border: none; border-radius: 6px; font-weight: bold; margin-top: 10px; }
        .btn-cancel { width: 100%; padding: 12px; background: #eee; color: #333; border: none; border-radius: 6px; font-weight: bold; margin-top: 5px; }
    </style>
</head>
<body>

    <div id="error-bar"></div>

    <div id="login-view">
        <div class="auth-box">
            <h2>Hakimi Pro</h2>
            <button class="btn-google" onclick="googleLogin()"><span>🔵</span> Sign in with Google</button>
            <p id="login-msg" style="color:red; font-size:12px; margin-top:15px;"></p>
        </div>
    </div>

    <div id="app-view">
        <aside>
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <strong style="font-size:16px;">Hakimi Tools</strong>
                <div id="userName" style="font-size:13px; color:#444; margin-bottom:15px; border-bottom:1px solid #eee; padding-bottom:5px;">
    Guest
</div>

                <span id="creditDisplay" style="color:#2563eb; font-weight:bold; font-size:13px;">...</span>
            </div>

            <label>UPLOAD</label>
            <input type="file" id="fInput" hidden>
            <div class="btn-upload" onclick="document.getElementById('fInput').click()">
                <span>📂 Choose File (4 Credits)</span>
            </div>

            <div class="row">
                <div class="col">
                    <label>Primary Width (in)</label>
                    <input type="number" id="tW" placeholder="100" oninput="draw()">
                </div>
                <div class="col">
                    <label>Primary Height (in)</label>
                    <input type="number" id="tH" placeholder="90" oninput="draw()">
                </div>
            </div>

            <div class="blue-box">
                <label>1. Split Widths (Columns)</label>
                <input type="text" id="sW" placeholder="e.g. 55, 55" oninput="draw()">
                
                <label style="margin-top:5px;">2. Split Heights (Rows)</label>
                <input type="text" id="sH" placeholder="e.g. 30, 30, 30" oninput="draw()">
                
                <label style="margin-top:5px;">Gap (in)</label>
                <input type="number" id="gap" placeholder="2" oninput="draw()">
            </div>

            <label>Panel Shape</label>
            <select id="shp" onchange="draw()">
                <option value="rect">Rectangle / Square</option>
                <option value="circle">Circle</option>
                <option value="arch-top">Arch Top</option>
                <option value="arch-bottom">Arch Bottom</option>
            </select>

            <div style="background:#f3f4f6; padding:10px; border-radius:8px; margin-top:5px;">
                <label>Zoom: <span id="zoomVal">1.0x</span></label>
                <input type="range" id="zoom" min="0.1" max="3.0" step="0.1" value="1.0" oninput="updateZoom()">
                
                <div class="check-row">
                    <input type="checkbox" id="mirror" onchange="draw()">
                    <label for="mirror" style="margin:0; font-weight:400; font-size:13px;">Mirror Flip</label>
                </div>

                <label style="margin-top:10px;">Fit Mode:</label>
                <select id="fitMode" onchange="draw()">
                    <option value="cover">Cover (Fill Area)</option>
                    <option value="stretch">Stretch (Force Fit)</option>
                    <option value="contain">Fit (Whole Image)</option>
                </select>
                
                <div style="display:flex; align-items:center; gap:10px; margin-top:10px;">
                    <input type="color" id="clr" value="#ffffff" oninput="draw()" style="width:30px; height:30px; border:none; background:none; padding:0;">
                    <span style="font-size:12px;">Extension Color</span>
                </div>
            </div>

            <button class="btn-black" onclick="downloadCanvas()" style="margin-top:15px;">Download</button>
            <button class="btn-link" onclick="auth.signOut()">Logout</button>
        </aside>

        <main>
            <div class="drag-hint">👆 Drag image to position</div>
            <div class="canvas-wrapper">
                <canvas id="cvs"></canvas>
            </div>
        </main>
    </div>

    <div id="modal">
        <div class="modal-box">
            <h3>Confirm Image</h3>
            <img id="modal-img" class="modal-img">
            <p>Cost: <b style="color:#dc2626">4 Credits</b></p>
            <button class="btn-confirm" onclick="closeModal(true)">Confirm</button>
            <button class="btn-cancel" onclick="closeModal(false)">Cancel</button>
        </div>
    </div>

    <script>
        // ----------------------------------------------------
        // KEYS (PASTE HERE)
        // ----------------------------------------------------
        var firebaseConfig = {
            apiKey: "AIzaSyBup3s_Z3nVZU-O5da0owglWaFXh5Fpfdg",
  authDomain: "customise-previews.firebaseapp.com",
  projectId: "customise-previews",
  storageBucket: "customise-previews.firebasestorage.app",
  messagingSenderId: "1073406972228",
  appId: "1:1073406972228:web:71ee5db786b2fe2af40711"
        };
        // ----------------------------------------------------

        // GLOBAL VARS
        var db, auth, currentUser, currentImg, tempSrc;
        var imgState = { x: 0, y: 0, zoom: 1.0, isDragging: false, lastX: 0, lastY: 0 };

        // ERROR TRAP
        window.onerror = function(msg, url, line) {
            var d = document.getElementById('error-bar');
            d.style.display = 'block';
            d.innerText = "Error Line " + line + ": " + msg;
        };

        // INIT FIREBASE
        try {
            if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
            db = firebase.firestore();
            auth = firebase.auth();
        } catch (e) { alert("Config Error: " + e.message); }

        // LOGIN
        function googleLogin() {
            var provider = new firebase.auth.GoogleAuthProvider();
            document.getElementById('login-msg').innerText = "Working...";
            auth.signInWithPopup(provider).catch(function(error) {
                document.getElementById('login-msg').innerText = error.message;
            });
        }

        // AUTH LISTENER
        if (auth) {
            auth.onAuthStateChanged(function(user) {
                if (user) {
                    currentUser = user;
                    document.getElementById('login-view').style.display = 'none';
                    document.getElementById('app-view').style.display = 'flex';
                    document.getElementById('userName').innerText = "👤 " + (user.displayName || user.email);
                    
                    
                    db.collection('users').doc(user.uid).onSnapshot(function(doc) {
                        if (!doc.exists) db.collection('users').doc(user.uid).set({email: user.email, credits: 10});
                        else document.getElementById('creditDisplay').innerText = (doc.data().credits || 0) + " Credits";
                    });
                    
                    setTimeout(draw, 500);
                } else {
                    document.getElementById('login-view').style.display = 'flex';
                    document.getElementById('app-view').style.display = 'none';
                }
            });
        }

        // APP LOGIC
        document.getElementById('fInput').addEventListener('change', function(e) {
            if (e.target.files[0]) {
                var reader = new FileReader();
                reader.onload = function(evt) { 
                    tempSrc = evt.target.result;
                    document.getElementById('modal-img').src = tempSrc;
                    document.getElementById('modal').style.display = 'flex';
                };
                reader.readAsDataURL(e.target.files[0]);
                e.target.value = '';
            }
        });

        function closeModal(shouldPay) {
            document.getElementById('modal').style.display = 'none';
            if (shouldPay && tempSrc) {
                var ref = db.collection('users').doc(currentUser.uid);
                
                db.runTransaction(function(t) {
                    return t.get(ref).then(function(doc) {
                        var c = doc.data().credits || 0;
                        if (c < 4) throw "Low Balance";
                        t.update(ref, { credits: c - 4 });
                    });
                }).then(function() {
                    var img = new Image();
                    img.onload = function() {
                        currentImg = img;
                        imgState.x = 0; imgState.y = 0; imgState.zoom = 1.0;
                        document.getElementById('zoom').value = 1.0;
                        document.getElementById('zoomVal').innerText = "1.0x";
                        tryColor(tempSrc);
                        draw();
                    };
                    img.src = tempSrc;
                }).catch(function(err) { alert(err); });
            }
            if(!shouldPay) tempSrc = null;
        }

        function tryColor(src) {
            var i = new Image();
            i.crossOrigin = "Anonymous";
            i.onload = function() {
                try {
                    var c = document.createElement('canvas'); c.width=1; c.height=1;
                    c.getContext('2d').drawImage(i,0,0,1,1);
                    var p = c.getContext('2d').getImageData(0,0,1,1).data;
                    var hex = "#" + ((1<<24)+(p[0]<<16)+(p[1]<<8)+p[2]).toString(16).slice(1);
                    document.getElementById('clr').value = hex;
                    draw();
                } catch(e){}
            };
            i.src = src;
        }

        function updateZoom() {
            var v = document.getElementById('zoom').value;
            imgState.zoom = parseFloat(v);
            document.getElementById('zoomVal').innerText = v + "x";
            draw();
        }

        // DRAG
        var cvs = document.getElementById('cvs');
        function startDrag(e) {
            imgState.isDragging = true;
            imgState.lastX = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
            imgState.lastY = e.type.includes('touch') ? e.touches[0].clientY : e.clientY;
        }
        function doDrag(e) {
            if(!imgState.isDragging) return;
            e.preventDefault(); 
            var cx = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
            var cy = e.type.includes('touch') ? e.touches[0].clientY : e.clientY;
            
            imgState.x += (cx - imgState.lastX);
            imgState.y += (cy - imgState.lastY);
            imgState.lastX = cx;
            imgState.lastY = cy;
            draw();
        }
        function stopDrag() { imgState.isDragging = false; }

        cvs.addEventListener('mousedown', startDrag);
        window.addEventListener('mousemove', doDrag);
        window.addEventListener('mouseup', stopDrag);
        cvs.addEventListener('touchstart', startDrag);
        window.addEventListener('touchmove', doDrag);
        window.addEventListener('touchend', stopDrag);

        function getV(id) {
            var el = document.getElementById(id);
            return parseFloat(el.value || el.placeholder) || 0;
        }

                function draw() {
            var ctx = cvs.getContext('2d');
            
            // 1. GET INPUTS
            var sW_raw = document.getElementById('sW').value;
            var sH_raw = document.getElementById('sH').value;
            var tW = getV('tW') || 100;
            var tH = getV('tH') || 90;
            var gap = getV('gap') || 2;
            var clr = document.getElementById('clr').value;
            var shp = document.getElementById('shp').value;
            var fit = document.getElementById('fitMode').value;
            var mirror = document.getElementById('mirror').checked;

            var cols = sW_raw ? sW_raw.split(',').map(Number).filter(function(n){ return n>0 }) : [tW];
            var rows = sH_raw ? sH_raw.split(',').map(Number).filter(function(n){ return n>0 }) : [tH];
            if(cols.length === 0) cols = [tW];
            if(rows.length === 0) rows = [tH];
            
            // 2. SET FIXED HD RESOLUTION
            var HD_SIZE = 1500; 
            cvs.width = HD_SIZE;
            cvs.height = HD_SIZE;
            
            // 3. CALCULATE VIRTUAL SIZE
            var gW = cols.reduce(function(a,b){ return a+b }, 0);
            var gH = rows.reduce(function(a,b){ return a+b }, 0);
            var vW = gW + ((cols.length-1)*gap);
            var vH = gH + ((rows.length-1)*gap);
            
            // 4. SAFE AREA (Increased padding for BIG text)
            var padTop = 60;
            var padRight = 60;
            var padLeft = 180;   // Increased from 120 -> 180
            var padBottom = 180; // Increased from 120 -> 180
            
            var safeW = cvs.width - (padLeft + padRight);
            var safeH = cvs.height - (padTop + padBottom);
            
            // 5. PPI RATIO
            var scaleX = safeW / vW;
            var scaleY = safeH / vH;
            var PPI = Math.min(scaleX, scaleY);

            // 6. CENTER DRAWING
            var finalDrawW = vW * PPI;
            var finalDrawH = vH * PPI;
            var startX = padLeft + (safeW - finalDrawW) / 2;
            var startY = padTop + (safeH - finalDrawH) / 2;

            // CLEAR
            ctx.fillStyle = "white"; ctx.fillRect(0,0,cvs.width, cvs.height);
            
            var cY = startY; var accH = 0;
            rows.forEach(function(h, rI) {
                var cX = startX; var accW = 0;
                var rShp = shp;
                if(shp.includes('arch')) {
                    if(shp==='arch-top' && rI!==0) rShp='rect';
                    if(shp==='arch-bottom' && rI!==rows.length-1) rShp='rect';
                }

                cols.forEach(function(w, cI) {
                    var dW = w*PPI; var dH = h*PPI;
                    
                    ctx.save();
                    
                    // A. SHAPE
                    ctx.beginPath(); trace(ctx, cX, cY, dW, dH, rShp, PPI); ctx.clip();
                    ctx.fillStyle = clr; ctx.fill();
                    
                    // B. IMAGE
                    if(currentImg) {
                        ctx.save();
                        var totalW_px = tW * PPI;
                        var totalH_px = tH * PPI;
                        
                        var panelCenterX = cX + (dW/2);
                        var panelCenterY = cY + (dH/2);
                        var relCenterX = panelCenterX - ( (accW + (w/2)) * PPI ) + (totalW_px/2);
                        var relCenterY = panelCenterY - ( (accH + (h/2)) * PPI ) + (totalH_px/2);
                        
                        ctx.translate(relCenterX + (imgState.x * (PPI/10)), relCenterY + (imgState.y * (PPI/10)));
                        ctx.scale(imgState.zoom, imgState.zoom);
                        if(mirror) ctx.scale(-1, 1);
                        
                        var drawW, drawH;
                        var imgRatio = currentImg.width / currentImg.height;
                        var areaRatio = totalW_px / totalH_px;
                        
                        if (fit === 'stretch') {
                            drawW = totalW_px; drawH = totalH_px;
                        } else if (fit === 'contain') {
                            if (imgRatio > areaRatio) { drawW = totalW_px; drawH = totalW_px / imgRatio; }
                            else { drawH = totalH_px; drawW = totalH_px * imgRatio; }
                        } else { 
                            if (imgRatio > areaRatio) { drawH = totalH_px; drawW = totalH_px * imgRatio; }
                            else { drawW = totalW_px; drawH = totalW_px / imgRatio; }
                        }
                        
                        ctx.drawImage(currentImg, -drawW/2, -drawH/2, drawW, drawH);
                        ctx.restore();
                    }
                    ctx.restore();
                    
                    // C. STROKE
                    ctx.lineWidth = 4; 
                    ctx.strokeStyle = "#333";
                    ctx.beginPath(); trace(ctx, cX, cY, dW, dH, rShp, PPI); ctx.stroke();
                    
                    // D. DIMENSION LINES & TEXT
                    // BIGGER FONT SIZE: 80px (2x previous)
                    var fontSize = 80; 
                    var fontStack = '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
                    
                    ctx.fillStyle = "#374151"; 
                    ctx.font = "bold " + fontSize + "px " + fontStack; 
                    ctx.textAlign = "center";
                    ctx.lineWidth = 3; // Thicker lines for bigger text
                    ctx.strokeStyle = "#6b7280"; 

                    // 1. WIDTH LINE (Bottom)
                    var lineY = cY + dH + 30; // Pushed down further
                    var tickH = 12;
                    
                    ctx.beginPath();
                    ctx.moveTo(cX, lineY); ctx.lineTo(cX + dW, lineY); 
                    ctx.moveTo(cX, lineY - tickH); ctx.lineTo(cX, lineY + tickH); 
                    ctx.moveTo(cX + dW, lineY - tickH); ctx.lineTo(cX + dW, lineY + tickH); 
                    ctx.stroke();

                    // Text
                    ctx.fillText(w + '"', cX + dW/2, lineY + fontSize + 10);
                    
                    // 2. HEIGHT LINE (Left)
                    var lineX = cX - 30; // Pushed left further
                    
                    ctx.beginPath();
                    ctx.moveTo(lineX, cY); ctx.lineTo(lineX, cY + dH); 
                    ctx.moveTo(lineX - tickH, cY); ctx.lineTo(lineX + tickH, cY); 
                    ctx.moveTo(lineX - tickH, cY + dH); ctx.lineTo(lineX + tickH, cY + dH); 
                    ctx.stroke();

                    // Text (Rotated)
                    ctx.save(); 
                    ctx.translate(lineX - (fontSize * 0.8), cY + dH/2); 
                    ctx.rotate(-Math.PI/2);
                    ctx.fillText(h + '"', 0, 0); 
                    ctx.restore();

                    cX += dW + (gap*PPI); accW += w;
                });
                cY += (h*PPI) + (gap*PPI); accH += h;
            });
        }




        function trace(ctx, x, y, w, h, t, p) {
            var d = Math.min(h, 10*p);
            if(t==='rect') ctx.rect(x,y,w,h);
            else if(t==='circle') ctx.ellipse(x+w/2, y+h/2, w/2, h/2, 0, 0, 2*Math.PI);
            else if(t==='arch-top') { ctx.moveTo(x,y+h); ctx.lineTo(x,y+d); ctx.bezierCurveTo(x,y, x+w,y, x+w,y+d); ctx.lineTo(x+w,y+h); }
            else if(t==='arch-bottom') { ctx.moveTo(x,y); ctx.lineTo(x+w,y); ctx.lineTo(x+w,y+h-d); ctx.bezierCurveTo(x+w,y+h, x,y+h, x,y+h-d); ctx.lineTo(x,y); }
            ctx.closePath();
        }

        function downloadCanvas() {
            var a = document.createElement('a');
            a.download = 'hakimi-preview.png';
            a.href = document.getElementById('cvs').toDataURL();
            a.click();
        }
    </script>
</body>
</html>
