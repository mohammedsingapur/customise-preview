<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hakimi Pro v32 - Dark UI</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>

   <style>
    #debug-screen {
        position: fixed; top: 0; left: 0; width: 100%; height: 200px;
        background: rgba(0,0,0,0.85); color: #0f0; font-family: monospace;
        font-size: 11px; padding: 10px; z-index: 999999; 
        overflow-y: scroll; pointer-events: none; border-bottom: 2px solid red;
    }
    .log-err { color: #ff5555; font-weight: bold; border-bottom: 1px solid #550000; }
    .log-info { color: #ffff00; }
</style>
<div id="debug-screen">SYSTEM LOG STARTED...<br></div>
<script>
    (function(){
        var screen = document.getElementById('debug-screen');
        function printLog(msg, type) {
            var l = document.createElement('div');
            l.className = type === 'error' ? 'log-err' : 'log-info';
            l.innerHTML = (type==='error'?'❌ ':'ℹ️ ') + msg;
            screen.appendChild(l);
            screen.scrollTop = screen.scrollHeight;
        }

        // 1. Capture Standard JS Errors
        window.onerror = function(msg, url, line) {
            printLog("JS Error (L" + line + "): " + msg, 'error');
        };

        // 2. Capture Promise Rejections (Firebase Auth Errors usually hide here)
        window.addEventListener('unhandledrejection', function(event) {
            printLog("Promise Error: " + (event.reason ? event.reason.message : event.reason), 'error');
        });

        // 3. Override Console.log/error to show on screen
        var oldLog = console.log;
        var oldErr = console.error;
        console.log = function(m) { printLog(m, 'info'); oldLog.apply(console, arguments); };
        console.error = function(m) { printLog(m, 'error'); oldErr.apply(console, arguments); };
    })();
</script>
    

    
    <style>
        /* --- DARK THEME VARIABLES --- */
        :root {
            --bg-color: #000000;
            --tool-bg: #121212;
            --text-color: #e0e0e0;
            --accent: #bb86fc; 
            --btn-bg: #2c2c2c;
            --border: #333;
        }

        /* RESET & BASE */
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            margin: 0; padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            height: 100vh; width: 100vw;
            overflow: hidden;
            display: flex; flex-direction: column;
        }

        /* --- DEBUG CONSOLE (Hidden by default) --- */
        #debug-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100px;
            background: rgba(0,0,0,0.9); color: #0f0; font-family: monospace;
            font-size: 10px; padding: 5px; z-index: 999999; 
            overflow-y: scroll; pointer-events: none; border-bottom: 1px solid red;
            display: none; 
        }

        /* --- LOGIN SCREEN --- */
        #login-view { 
            position: fixed; inset: 0; z-index: 5000; 
            background: var(--bg-color); 
            display: flex; flex-direction: column; justify-content: center; align-items: center; 
        }
        .auth-box { 
            width: 300px; padding: 30px; text-align: center; 
            background: var(--tool-bg); 
            border-radius: 12px; border: 1px solid var(--border); 
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }
        .btn-google {
            width: 100%; padding: 15px; background: #4285F4; color: white; 
            border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 16px;
            display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 20px;
        }

        /* --- APP LAYOUT (80/20 SPLIT) --- */
        #app-view { display: none; width: 100%; height: 100%; flex-direction: column; }

        /* 1. CANVAS AREA (80vh) */
        .canvas-area {
            height: 80vh; width: 100%;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            background: radial-gradient(circle at center, #222 0%, #000 100%);
            position: relative; overflow: hidden;
        }
        .canvas-wrapper { width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; padding: 20px; }
        
        canvas { 
            background: white; 
            box-shadow: 0 10px 50px rgba(0,0,0,0.8); 
            max-width: 100%; max-height: 95%; 
            cursor: grab; border: 1px solid #444;
        }
        canvas:active { cursor: grabbing; }

        /* HUD */
        .hud-bar {
            position: absolute; top: 15px; left: 15px; right: 15px;
            display: flex; justify-content: space-between; align-items: center;
            pointer-events: none; z-index: 10;
        }
        .user-tag { background: rgba(0,0,0,0.6); padding: 5px 12px; border-radius: 20px; font-size: 12px; color: #fff; border: 1px solid #444; }
        .credit-tag { background: var(--accent); color: #000; font-weight: bold; padding: 5px 12px; border-radius: 20px; font-size: 12px; box-shadow: 0 0 10px rgba(187, 134, 252, 0.4); }

        /* 2. TOOLS AREA (20vh) */
        .tools-area {
            height: 20vh; width: 100%; background-color: var(--tool-bg);
            border-top: 1px solid var(--border);
            display: flex; align-items: center;
            overflow-x: auto; padding: 0 15px; gap: 20px;
        }
        .tools-area::-webkit-scrollbar { display: none; } /* Hide Scrollbar */

        /* TOOL BUTTONS */
        .tool-group { display: flex; flex-direction: column; align-items: center; min-width: 60px; cursor: pointer; }
        .tool-btn {
            width: 55px; height: 55px; background-color: var(--btn-bg);
            border-radius: 50%; display: flex; justify-content: center; align-items: center;
            font-size: 22px; margin-bottom: 8px; border: 1px solid var(--border); color: white;
            transition: transform 0.1s;
        }
        .tool-btn:active { transform: scale(0.9); background-color: #444; }
        .tool-label { font-size: 11px; color: #888; text-align: center; white-space: nowrap; font-weight: 500; }
        
        /* Special Button Styles */
        .tool-btn.active { border-color: var(--accent); color: var(--accent); }
        .pro-tool .tool-btn { border: 2px solid var(--accent); color: var(--accent); background: rgba(187, 134, 252, 0.1); }
        .pro-tool .tool-label { color: var(--accent); }
        
        .separator { width: 1px; height: 50%; background: #333; min-width: 1px; }

        /* HIDDEN CONTROLS & MODAL */
        .hidden-controls { display: none; }
        
        #modal { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 6000; display: none; justify-content: center; align-items: center; }
        .modal-box { background: var(--tool-bg); width: 85%; max-width: 320px; padding: 25px; border-radius: 16px; text-align: center; border: 1px solid var(--border); }
        .modal-img { max-width: 100%; height: 180px; object-fit: contain; margin: 15px 0; background: #000; border-radius: 8px; }
        .btn-confirm { width: 100%; padding: 14px; background: var(--accent); color: #000; border: none; border-radius: 8px; font-weight: bold; margin-top: 10px; font-size: 16px; }
        .btn-cancel { width: 100%; padding: 14px; background: #333; color: #fff; border: none; border-radius: 8px; font-weight: bold; margin-top: 8px; }
    </style>
</head>
<body>

    <div id="debug-screen">SYSTEM LOG STARTED...<br></div>

    <div class="hidden-controls">
        <input type="file" id="fInput">
        <input type="number" id="tW" value="100">
        <input type="number" id="tH" value="90">
        <input type="text" id="sW">
        <input type="text" id="sH">
        <input type="number" id="gap" value="2">
        <select id="shp"><option value="rect">Rect</option><option value="circle">Circle</option><option value="arch-top">Arch Top</option><option value="arch-bottom">Arch Bottom</option></select>
        <input type="range" id="zoom" min="0.1" max="3.0" step="0.1" value="1.0">
        <input type="checkbox" id="mirror">
        <select id="fitMode"><option value="cover">Cover</option><option value="stretch">Stretch</option><option value="contain">Contain</option></select>
        <input type="color" id="clr" value="#ffffff">
    </div>

    <div id="login-view">
        <div class="auth-box">
            <h2 style="color:white; margin:0 0 10px 0;">Hakimi Pro</h2>
            <p style="color:#666; font-size:12px;">Dark Edition v32</p>
            <button class="btn-google" id="btnLogin" onclick="googleLogin()">
                <span>📂</span> Sign in with Google
            </button>
            <div id="login-msg" style="margin-top:15px; font-size:12px; color:#ff5555;"></div>
        </div>
    </div>

    <div id="app-view">
        <div class="canvas-area">
            <div class="hud-bar">
                <div class="user-tag" id="userName">Guest</div>
                <div class="credit-tag" id="creditDisplay">...</div>
            </div>
            <div class="canvas-wrapper"><canvas id="cvs"></canvas></div>
        </div>

        <div class="tools-area">
            
            <div class="tool-group" onclick="handleUploadClick()">
                <div class="tool-btn" style="background:#fff; color:#000;">📂</div>
                <span class="tool-label">Upload</span>
            </div>

            <div class="separator"></div>

            <div class="tool-group" onclick="promptVal('tW', 'Width (in)')">
                <div class="tool-btn">↔️</div><span class="tool-label">Width</span>
            </div>
            <div class="tool-group" onclick="promptVal('tH', 'Height (in)')">
                <div class="tool-btn">↕️</div><span class="tool-label">Height</span>
            </div>

            <div class="separator"></div>

            <div class="tool-group" onclick="cycleZoom()">
                <div class="tool-btn">🔍</div><span class="tool-label" id="lbl-zoom">1.0x</span>
            </div>
            <div class="tool-group" onclick="cycleFit()">
                <div class="tool-btn">🖼️</div><span class="tool-label" id="lbl-fit">Cover</span>
            </div>
            <div class="tool-group" onclick="toggleMirror()">
                <div class="tool-btn">🪞</div><span class="tool-label">Flip</span>
            </div>
            <div class="tool-group" onclick="cycleShape()">
                <div class="tool-btn">⬜</div><span class="tool-label" id="lbl-shape">Rect</span>
            </div>

            <div class="tool-group">
                <div class="tool-btn" style="position:relative; overflow:hidden;">
                    <input type="color" oninput="updateColor(this.value)" value="#ffffff" style="position:absolute; top:-10px; left:-10px; width:200%; height:200%; opacity:0; cursor:pointer;">
                    <div style="pointer-events:none;">🎨</div>
                </div>
                <span class="tool-label">Color</span>
            </div>

            <div class="separator"></div>

            <div class="tool-group pro-tool" id="btn-pro-tools" onclick="activateProTools()">
                <div class="tool-btn">🔓</div><span class="tool-label">Unlock</span>
            </div>
            
            <div id="pro-tools-grp" style="display:none; gap:20px;">
                <div class="tool-group pro-tool" onclick="promptVal('sW', 'Split Widths (e.g. 50,50)')">
                    <div class="tool-btn">✂️</div><span class="tool-label">Split W</span>
                </div>
                <div class="tool-group pro-tool" onclick="promptVal('sH', 'Split Heights (e.g. 30,30)')">
                    <div class="tool-btn">➗</div><span class="tool-label">Split H</span>
                </div>
                <div class="tool-group pro-tool" onclick="promptVal('gap', 'Gap Size (in)')">
                    <div class="tool-btn">Gap</div><span class="tool-label">Gap</span>
                </div>
            </div>

            <div class="separator"></div>

            <div class="tool-group" onclick="downloadCanvas()">
                <div class="tool-btn" style="background:#333; border-color:#666;">⬇️</div>
                <span class="tool-label">Save</span>
            </div>
             <div class="tool-group" onclick="auth.signOut()">
                <div class="tool-btn" style="background:#3f0000; border-color:#500; color:#ffaaaa;">X</div>
                <span class="tool-label">Exit</span>
            </div>
        </div>
    </div>

    <div id="modal">
        <div class="modal-box">
            <h3 style="color:#fff; margin-top:0;">Confirm Image</h3>
            <img id="modal-img" class="modal-img">
            <p style="color:#aaa">Cost: <b style="color:var(--accent)">4 Credits</b></p>
            <button class="btn-confirm" onclick="closeModal(true)">Confirm & Pay</button>
            <button class="btn-cancel" onclick="closeModal(false)">Cancel</button>
        </div>
    </div>

    <script>
        // --- LOGGER ---
        var screen = document.getElementById('debug-screen');
        function printLog(msg, type) {
            console.log(msg);
            // Uncomment next line to see logs on screen for debugging
            // screen.style.display = 'block'; 
            var l = document.createElement('div');
            l.className = type === 'error' ? 'log-err' : 'log-info';
            l.innerText = (type==='error'?'❌ ':'ℹ️ ') + msg;
            screen.appendChild(l);
        }
        window.onerror = function(msg, url, line) { printLog("JS Error (L" + line + "): " + msg, 'error'); };
        window.addEventListener('unhandledrejection', function(event) { printLog("Promise: " + event.reason, 'error'); });

        // --- FIREBASE CONFIG ---
        var firebaseConfig = {
            apiKey: "AIzaSyBup3s_Z3nVZU-O5da0owglWaFXh5Fpfdg",
            authDomain: "customise-previews.firebaseapp.com",
            projectId: "customise-previews",
            storageBucket: "customise-previews.firebasestorage.app",
            messagingSenderId: "1073406972228",
            appId: "1:1073406972228:web:71ee5db786b2fe2af40711"
        };

        var db, auth, currentUser, currentImg, tempSrc, uploadedFileName;
        var imgState = { x: 0, y: 0, zoom: 1.0, isDragging: false, lastX: 0, lastY: 0 };

        try {
            firebase.initializeApp(firebaseConfig);
            db = firebase.firestore();
            auth = firebase.auth();
        } catch(e) { printLog(e.message, 'error'); }

        // --- LOGIN ---
        function googleLogin() {
            if(!auth) return;
            var provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider).catch(function(err){ 
                document.getElementById('login-msg').innerText = err.message;
            });
        }

        if(auth) {
            auth.onAuthStateChanged(function(user) {
                if(user) {
                    currentUser = user;
                    document.getElementById('login-view').style.display = 'none';
                    document.getElementById('app-view').style.display = 'flex';
                    document.getElementById('userName').innerText = (user.displayName||user.email).split(' ')[0];
                    
                    db.collection('users').doc(user.uid).onSnapshot(function(doc){
                        if(!doc.exists) db.collection('users').doc(user.uid).set({email:user.email, credits:10});
                        else document.getElementById('creditDisplay').innerText = (doc.data().credits||0) + " Cr";
                    });
                    setTimeout(draw, 500);
                } else {
                    document.getElementById('login-view').style.display = 'flex';
                    document.getElementById('app-view').style.display = 'none';
                }
            });
        }

        // --- UI BRIDGE FUNCTIONS (Button -> Hidden Input) ---
        function promptVal(id, text) {
            var el = document.getElementById(id);
            var val = prompt(text, el.value);
            if(val !== null) { el.value = val; draw(); }
        }
        function cycleZoom() {
            var el = document.getElementById('zoom');
            var val = parseFloat(el.value);
            val = (val >= 3.0) ? 0.5 : val + 0.5;
            el.value = val;
            document.getElementById('lbl-zoom').innerText = val + "x";
            draw();
        }
        function cycleFit() {
            var el = document.getElementById('fitMode');
            var opts = ['cover', 'stretch', 'contain'];
            el.value = opts[(opts.indexOf(el.value) + 1) % opts.length];
            document.getElementById('lbl-fit').innerText = el.value;
            draw();
        }
        function toggleMirror() {
            var el = document.getElementById('mirror');
            el.checked = !el.checked;
            draw();
        }
        function cycleShape() {
            var el = document.getElementById('shp');
            var opts = ['rect', 'circle', 'arch-top', 'arch-bottom'];
            el.value = opts[(opts.indexOf(el.value) + 1) % opts.length];
            document.getElementById('lbl-shape').innerText = el.value.replace('-',' ');
            draw();
        }
        function updateColor(val) {
            document.getElementById('clr').value = val;
            draw();
        }
        
        function handleUploadClick() {
            document.getElementById('fInput').click();
            // Reset Pro Logic
            document.getElementById('btn-pro-tools').style.display = 'flex';
            document.getElementById('pro-tools-grp').style.display = 'none';
            document.getElementById('sW').value = '';
            document.getElementById('sH').value = '';
        }

        function activateProTools() {
            if(!currentUser) return;
            var btn = document.getElementById('btn-pro-tools');
            btn.querySelector('.tool-label').innerText = "...";
            
            var ref = db.collection('users').doc(currentUser.uid);
            db.runTransaction(function(t){
                return t.get(ref).then(function(doc){
                    var c = doc.data().credits || 0;
                    if(c < 2) throw "Need 2 Credits";
                    t.update(ref, { credits: c - 2 });
                });
            }).then(function(){
                btn.style.display = 'none';
                document.getElementById('pro-tools-grp').style.display = 'flex';
                document.getElementById('gap').value = '2'; 
                btn.querySelector('.tool-label').innerText = "Unlock";
                draw();
            }).catch(function(e){ alert(e); btn.querySelector('.tool-label').innerText = "Unlock"; });
        }

        // --- DRAWING LOGIC ---
        var cvs = document.getElementById('cvs');
        function getV(id) { var el=document.getElementById(id); return parseFloat(el.value||el.placeholder)||0; }

        document.getElementById('fInput').addEventListener('change', function(e) {
            if(e.target.files[0]) {
                var file = e.target.files[0];
                uploadedFileName = file.name.split('.')[0];
                var reader = new FileReader();
                reader.onload = function(evt) {
                    tempSrc = evt.target.result;
                    document.getElementById('modal-img').src = tempSrc;
                    document.getElementById('modal').style.display = 'flex';
                };
                reader.readAsDataURL(file);
                e.target.value = '';
            }
        });

        function closeModal(pay) {
            document.getElementById('modal').style.display = 'none';
            if(pay && tempSrc) {
                var ref = db.collection('users').doc(currentUser.uid);
                db.runTransaction(function(t){
                    return t.get(ref).then(function(doc){
                        var c = doc.data().credits || 0;
                        if(c < 4) throw "Low Balance";
                        t.update(ref, { credits: c - 4 });
                    });
                }).then(function(){
                    var img = new Image();
                    img.onload = function(){
                        currentImg = img; imgState = {x:0, y:0, zoom:1.0};
                        document.getElementById('zoom').value = 1.0;
                        draw();
                    };
                    img.src = tempSrc;
                }).catch(function(e){ alert(e); });
            }
        }

        // Drag
        function startDrag(e){ imgState.isDragging=true; imgState.lastX=e.touches?e.touches[0].clientX:e.clientX; imgState.lastY=e.touches?e.touches[0].clientY:e.clientY; }
        function doDrag(e){
            if(!imgState.isDragging) return;
            e.preventDefault();
            var cx=e.touches?e.touches[0].clientX:e.clientX; var cy=e.touches?e.touches[0].clientY:e.clientY;
            imgState.x += (cx - imgState.lastX); imgState.y += (cy - imgState.lastY);
            imgState.lastX = cx;
