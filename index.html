<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hakimi Pro | Admin</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root { --primary: #0f172a; --accent: #2563eb; --bg: #f1f5f9; --border: #e2e8f0; }
        * { box-sizing: border-box; }
        
        body { font-family: 'Inter', sans-serif; background: var(--bg); margin: 0; height: 100vh; display: flex; overflow: hidden; }

        /* --- LOGIN SCREEN (Fixed Layout) --- */
        #login-view {
            position: fixed; inset: 0; z-index: 50;
            background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(8px);
            display: flex; align-items: center; justify-content: center;
        }
        .auth-card {
            background: white; width: 100%; max-width: 380px; padding: 40px;
            border-radius: 16px; box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            border: 1px solid white; text-align: center;
        }
        .auth-inp {
            width: 100%; padding: 14px; margin-bottom: 12px;
            border: 1px solid var(--border); border-radius: 8px;
            font-size: 15px; transition: 0.2s; background: #f8fafc;
        }
        .auth-inp:focus { outline: none; border-color: var(--accent); background: white; }
        .btn-primary {
            width: 100%; padding: 14px; background: var(--primary); color: white;
            border: none; border-radius: 8px; font-weight: 600; cursor: pointer;
            font-size: 15px; margin-top: 10px; transition: 0.2s;
        }
        .btn-primary:hover { background: #334155; }
        .error-msg { color: #dc2626; font-size: 13px; margin-top: 15px; min-height: 20px; }

        /* --- MAIN DASHBOARD --- */
        #app-view { display: none; width: 100%; height: 100%; }
        
        /* Sidebar */
        aside {
            width: 340px; background: white; border-right: 1px solid var(--border);
            display: flex; flex-direction: column; overflow-y: auto; padding: 25px; gap: 25px;
        }
        .brand { font-size: 18px; font-weight: 700; color: var(--primary); display: flex; justify-content: space-between; align-items: center; }
        .credit-badge { font-size: 13px; background: #eff6ff; color: var(--accent); padding: 5px 12px; border-radius: 20px; font-weight: 600; }

        .control-group h3 { font-size: 12px; text-transform: uppercase; color: #64748b; margin: 0 0 10px 0; letter-spacing: 0.5px; }
        
        .upload-btn {
            border: 2px dashed #cbd5e1; border-radius: 8px; padding: 20px;
            text-align: center; cursor: pointer; transition: 0.2s; color: #64748b; font-size: 14px;
        }
        .upload-btn:hover { border-color: var(--accent); color: var(--accent); background: #eff6ff; }
        
        .row { display: flex; gap: 10px; margin-bottom: 10px; }
        label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 5px; color: #334155; }
        input[type="text"], input[type="number"], select {
            width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 6px;
            font-size: 14px; color: #0f172a;
        }
        
        /* Canvas Area */
        main {
            flex: 1; background: #e2e8f0; display: flex; 
            align-items: center; justify-content: center; overflow: auto; padding: 40px;
        }
        canvas { background: white; box-shadow: 0 10px 30px rgba(0,0,0,0.15); max-width: 100%; border-radius: 4px; }

        /* Modal */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 100;
            display: none; align-items: center; justify-content: center;
        }
        .modal-box { background: white; padding: 25px; border-radius: 12px; width: 90%; max-width: 350px; text-align: center; }
        .preview-thumb { max-width: 100%; height: 180px; object-fit: contain; margin: 15px 0; border: 1px solid #eee; }

    </style>
</head>
<body>

    <div id="login-view">
        <div class="auth-card">
            <h2 style="margin: 0 0 5px 0;">Welcome Back</h2>
            <p style="color: #64748b; font-size: 14px; margin: 0 0 25px 0;">Sign in to Hakimi Preview Tool</p>
            
            <form onsubmit="handleLogin(event)">
                <input type="email" id="email" class="auth-inp" placeholder="Email address" required>
                <input type="password" id="password" class="auth-inp" placeholder="Password" required>
                <button type="submit" class="btn-primary">Sign In</button>
            </form>
            
            <div style="margin-top: 15px; font-size: 13px;">
                <a href="#" onclick="handleSignup(event)" style="color: var(--accent); text-decoration: none;">Create an account</a>
            </div>
            <div id="auth-error" class="error-msg"></div>
        </div>
    </div>

    <div id="app-view">
        <aside>
            <div class="brand">
                <span>Hakimi Pro</span>
                <span id="credit-display" class="credit-badge">...</span>
            </div>

            <div class="control-group">
                <h3>1. Source File</h3>
                <input type="file" id="file-in" hidden accept="image/*">
                <label for="file-in" class="upload-btn">
                    <strong>Click to Upload</strong><br>
                    <span style="font-size:12px; opacity:0.8">Cost: 4 Credits</span>
                </label>
                <div style="display:flex; gap:5px; margin-top:10px;">
                    <input type="text" id="link-in" placeholder="https://...">
                    <button onclick="handleLink()" style="background:#334155; color:white; border:none; border-radius:6px; padding:0 15px; cursor:pointer;">Go</button>
                </div>
            </div>

            <div class="control-group">
                <h3>2. Dimensions</h3>
                <label>Split Widths (Cols)</label>
                <input type="text" id="sW" placeholder="55, 55" oninput="draw()">
                
                <label style="margin-top:10px;">Split Heights (Rows)</label>
                <input type="text" id="sH" placeholder="90" oninput="draw()">
            </div>

            <div class="control-group">
                <h3>3. Settings</h3>
                <div class="row">
                    <div><label>Total W</label><input type="number" id="tW" placeholder="110" oninput="draw()"></div>
                    <div><label>Total H</label><input type="number" id="tH" placeholder="90" oninput="draw()"></div>
                </div>
                <div class="row">
                    <div style="flex:1"><label>Color</label><input type="color" id="clr" value="#ffffff" style="width:100%; height:42px; padding:2px;" oninput="draw()"></div>
                    <div style="flex:1"><label>Gap</label><input type="number" id="gap" placeholder="2" oninput="draw()"></div>
                </div>
                <label>Shape</label>
                <select id="shp" onchange="draw()">
                    <option value="rect">Rectangle</option>
                    <option value="circle">Circle</option>
                    <option value="arch-top">Arch Top</option>
                    <option value="arch-bottom">Arch Bottom</option>
                </select>
            </div>

            <button class="btn-primary" onclick="downloadCanvas()">Download Preview</button>
            <button onclick="auth.signOut()" style="background:none; border:none; color:#ef4444; font-size:13px; cursor:pointer; align-self:center;">Sign Out</button>
        </aside>

        <main>
            <canvas id="main-canvas"></canvas>
        </main>
    </div>

    <div id="modal" class="modal-overlay">
        <div class="modal-box">
            <h3 style="margin:0;">Confirm Image</h3>
            <img id="modal-img" class="preview-thumb">
            <p>Cost: <b style="color:#dc2626">4 Credits</b></p>
            <div class="row">
                <button onclick="closeModal(false)" style="flex:1; padding:12px; background:#f1f5f9; border:none; border-radius:8px; cursor:pointer;">Cancel</button>
                <button onclick="closeModal(true)" style="flex:1; padding:12px; background:var(--accent); color:white; border:none; border-radius:8px; cursor:pointer;">Confirm</button>
            </div>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="app.js"></script>
</body>
</html>
