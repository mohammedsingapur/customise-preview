<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hakimi Pro v28 - Fixed</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>

    <style>
        /* --- DARK THEME VARIABLES --- */
        :root {
            --bg-color: #121212;
            --tool-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --accent: #bb86fc; 
            --btn-bg: #333333;
            --border: #444;
        }

        /* RESET */
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            margin: 0; padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            height: 100vh; width: 100vw;
            overflow: hidden;
            display: flex; flex-direction: column;
        }

        /* --- DEBUG CONSOLE (Top Fixed) --- */
        #debug-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: auto; max-height: 100px;
            background: rgba(50, 0, 0, 0.9); border-bottom: 2px solid red;
            color: #ff9999; font-family: monospace; font-size: 10px;
            padding: 5px; overflow-y: auto; z-index: 200000;
            display: none; pointer-events: none; /* Let clicks pass through unless selecting text */
        }

        /* --- LOGIN SCREEN (Highest Z-Index) --- */
        #login-view { 
            position: fixed; inset: 0; z-index: 100000; 
            background: var(--bg-color); 
            display: flex; justify-content: center; align-items: center; 
        }
        .auth-box { 
            width: 300px; padding: 30px; text-align: center; 
            background: var(--tool-bg); 
            border-radius: 12px; border: 1px solid var(--border); 
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
        }
        .btn-google {
            width: 100%; padding: 15px; background: #4285F4; color: white; 
            border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 16px;
            display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 20px;
        }
        .btn-google:active { transform: scale(0.98); }

        /* --- APP LAYOUT (80/20) --- */
        #app-view { display: none; width: 100%; height: 100%; flex-direction: column; }

        /* 1. CANVAS AREA (80vh) */
        .canvas-area {
            height: 80vh; width: 100%;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            background: radial-gradient(circle at center, #2c2c2c 0%, #000 100%);
            position: relative; overflow: hidden;
        }
        .canvas-wrapper { width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; }
        
        canvas { 
            background: white; 
            box-shadow: 0 10px 40px rgba(0,0,0,0.6); 
            max-width: 95%; max-height: 90%; 
            cursor: grab; border: 1px solid #333;
        }

        /* HUD */
        .hud-bar {
            position: absolute; top: 10px; left: 10px; right: 10px;
            display: flex; justify-content: space-between; align-items: center;
            pointer-events: none; z-index: 10;
        }
        .user-tag { background: rgba(0,0,0,0.6); padding: 5px 10px; border-radius: 20px; font-size: 12px; color: #fff; }
        .credit-tag { background: var(--accent); color: #000; font-weight: bold; padding: 5px 10px; border-radius: 20px; font-size: 12px; }

        /* 2. TOOLS AREA (20vh) */
        .tools-area {
            height: 20vh; width: 100%; background-color: var(--tool-bg);
            border-top: 1px solid var(--border);
            display: flex; align-items: center;
            overflow-x: auto; padding: 0 15px; gap: 20px;
        }
        /* Hide scrollbar */
        .tools-area::-webkit-scrollbar { display: none; }
        .tools-area { -ms-overflow-style: none; scrollbar-width: none; }

        /* BUTTONS */
        .tool-group { display: flex; flex-direction: column; align-items: center; min-width: 65px; cursor: pointer; }
        .tool-btn {
            width: 55px; height: 55px; background-color: var(--btn-bg);
            border-radius: 50%; display: flex; justify-content: center; align-items: center;
            font-size: 22px; margin-bottom: 6px; border: 1px solid var(--border); color: white;
            transition: 0.2s;
        }
        .tool-btn:active { transform: scale(0.9); background-color: #555; }
        .tool-label { font-size: 11px; color: #aaa; text-align: center; white-space: nowrap; }
        
        .pro-tool .tool-btn { border: 2px solid var(--accent); color: var(--accent); }
        .pro-tool .tool-label { color: var(--accent); font-weight: bold; }
        .separator { width: 1px; height: 50%; background: #444; min-width: 1px; }

        /* MODAL & HIDDEN CONTROLS */
        .hidden-controls { display: none; }
        #modal { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 10001; display: none; justify-content: center; align-items: center; }
        .modal-box { background: var(--tool-bg); width: 85%; max-width: 320px; padding: 20px; border-radius: 12px; text-align: center; border: 1px solid var(--border); }
        .modal-img { max-width: 100%; height: 180px; object-fit: contain; margin: 15px 0; border: 1px solid #444; background: #000; }
        .btn-confirm { width: 100%; padding: 12px; background: var(--accent); color: #000; border: none; border-radius: 6px; font-weight: bold; margin-top: 10px; }
        .btn-cancel { width: 100%; padding: 12px; background: #333; color: #fff; border: none; border-radius: 6px; font-weight: bold; margin-top: 5px; }
    </style>
</head>
<body>

    <div id="debug-overlay">SYSTEM LOG:<br></div>

    <div class="hidden-controls">
        <input type="file" id="fInput">
        <input type="number" id="tW" value="100">
        <input type="number" id="tH" value="90">
        <input type="text" id="sW">
        <input type="text" id="sH">
        <input type="number" id="gap" value="2">
        <select id="shp"><option value="rect">Rect</option><option value="circle">Circle</option><option value="arch-top">Arch Top</option><option value="arch-bottom">Arch Bottom</option></select>
        <input type="range" id="zoom" min="0.1" max="3.0" step="0.1" value="1.0">
        <input type="checkbox" id="mirror">
        <select id="fitMode"><option value="cover">Cover</option><option value="stretch">Stretch</option><option value="contain">Contain</option></select>
        <input type="color" id="clr" value="#ffffff">
    </div>

    <div id="login-view">
        <div class="auth-box">
            <h2 style="color:white; margin:0 0 10px 0;">Hakimi Pro</h2>
            <p style="color:#888; font-size:12px; margin-bottom:20px;">Dark Mode v28</p>
            <button class="btn-google" id="btnLogin"><span>📂</span> Sign in with Google</button>
            <p id="login-msg" style="color:#ff6b6b; font-size:12px; margin-top:15px; font-family:monospace; word-break:break-word;"></p>
        </div>
    </div>

    <div id="app-view">
        <div class="canvas-area">
            <div class="hud-bar">
                <div class="user-tag" id="userName">Guest</div>
                <div class="credit-tag" id="creditDisplay">...</div>
            </div>
            <div class="canvas-wrapper"><canvas id="cvs"></canvas></div>
        </div>

        <div class="tools-area">
            <div class="tool-group" onclick="handleUploadClick()">
                <div class="tool-btn" style="background:var(--accent); color:black;">📂</div><span class="tool-label">Upload</span>
            </div>
            <div class="separator"></div>
            
            <div class="tool-group" onclick="promptVal('tW', 'Width (in)')">
                <div class="tool-btn">↔️</div><span class="tool-label">Width</span>
            </div>
            <div class="tool-group" onclick="promptVal('tH', 'Height (in)')">
                <div class="tool-btn">↕️</div><span class="tool-label">Height</span>
            </div>
            <div class="separator"></div>

            <div class="tool-group" onclick="cycleZoom()">
                <div class="tool-btn">🔍</div><span class="tool-label" id="lbl-zoom">1.0x</span>
            </div>
            <div class="tool-group" onclick="cycleFit()">
                <div class="tool-btn">🖼️</div><span class="tool-label" id="lbl-fit">Cover</span>
            </div>
            <div class="tool-group" onclick="toggleMirror()">
                <div class="tool-btn">🪞</div><span class="tool-label">Flip</span>
            </div>
            <div class="tool-group" onclick="cycleShape()">
                <div class="tool-btn">⬜</div><span class="tool-label" id="lbl-shape">Rect</span>
            </div>
            <div class="tool-group">
                <div class="tool-btn" style="overflow:hidden; position:relative;">
                    <input type="color" oninput="updateColor(this.value)" value="#ffffff" style="position:absolute; opacity:0; width:100%; height:100%;">
                    <div style="pointer-events:none;">🎨</div>
                </div>
                <span class="tool-label">Color</span>
            </div>
            <div class="separator"></div>

            <div class="tool-group pro-tool" id="btn-pro-lock" onclick="activateProTools()">
                <div class="tool-btn">🔓</div><span class="tool-label">Unlock</span>
            </div>
            <div id="pro-tools-grp" style="display:none; display:flex; gap:20px;">
                <div class="tool-group pro-tool" onclick="promptVal('sW', 'Split Widths (e.g. 50,50)')">
                    <div class="tool-btn">✂️</div><span class="tool-label">Split W</span>
                </div>
                <div class="tool-group pro-tool" onclick="promptVal('sH', 'Split Heights (e.g. 30,30)')">
                    <div class="tool-btn">➗</div><span class="tool-label">Split H</span>
                </div>
                <div class="tool-group pro-tool" onclick="promptVal('gap', 'Gap Size (in)')">
                    <div class="tool-btn">Gap</div><span class="tool-label">Gap</span>
                </div>
            </div>

            <div class="separator"></div>
            <div class="tool-group" onclick="downloadCanvas()">
                <div class="tool-btn" style="background:#fff; color:#000;">⬇️</div><span class="tool-label">Save</span>
            </div>
             <div class="tool-group" onclick="auth.signOut()">
                <div class="tool-btn" style="background:#7f1d1d; color:#fff;">X</div><span class="tool-label">Exit</span>
            </div>
        </div>
    </div>

    <div id="modal">
        <div class="modal-box">
            <h3 style="color:var(--text-color)">Confirm Image</h3>
            <img id="modal-img" class="modal-img">
            <p style="color:#aaa">Cost: <b style="color:var(--accent)">4 Credits</b></p>
            <button class="btn-confirm" onclick="closeModal(true)">Confirm</button>
            <button class="btn-cancel" onclick="closeModal(false)">Cancel</button>
        </div>
    </div>

    <script>
        // --- 1. ERROR LOGGING SYSTEM ---
        function sysLog(msg, isError) {
            console.log(msg);
            var d = document.getElementById('debug-overlay');
            var span = document.createElement('div');
            span.style.color = isError ? '#ff4444' : '#00ff00';
            span.innerHTML = (isError ? "❌ " : "ℹ️ ") + msg;
            d.appendChild(span);
            if(isError) d.style.display = 'block';
        }

        window.onerror = function(msg, url, line) {
            sysLog("JS Error (L" + line + "): " + msg, true);
        };
        window.addEventListener('unhandledrejection', function(event) {
            sysLog("Promise Error: " + event.reason, true);
        });

        // --- 2. FIREBASE CONFIG ---
        var firebaseConfig = {
            apiKey: "AIzaSyBup3s_Z3nVZU-O5da0owglWaFXh5Fpfdg",
            authDomain: "customise-previews.firebaseapp.com",
            projectId: "customise-previews",
            storageBucket: "customise-previews.firebasestorage.app",
            messagingSenderId: "1073406972228",
            appId: "1:1073406972228:web:71ee5db786b2fe2af40711"
        };

        // --- 3. VARIABLES ---
        var db, auth, currentUser, currentImg, tempSrc, uploadedFileName;
        var imgState = { x: 0, y: 0, zoom: 1.0, isDragging: false, lastX: 0, lastY: 0 };

        // --- 4. INIT ---
        try {
            if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
            db = firebase.firestore();
            auth = firebase.auth();
            sysLog("Firebase Initialized.");
        } catch (e) { sysLog("Config Error: " + e.message, true); }

        // --- 5. LOGIN ---
        document.getElementById('btnLogin').addEventListener('click', function() {
            sysLog("Starting Login...");
            var provider = new firebase.auth.GoogleAuthProvider();
            document.getElementById('login-msg').innerText = "Opening Popup...";
            
            auth.signInWithPopup(provider)
                .then((result) => { sysLog("Login Success: " + result.user.email); })
                .catch((error) => {
                    sysLog("Login Fail: " + error.code + " " + error.message, true);
                    document.getElementById('login-msg').innerText = error.message;
                });
        });

        if (auth) {
            auth.onAuthStateChanged(function(user) {
                if (user) {
                    currentUser = user;
                    document.getElementById('login-view').style.display = 'none';
                    document.getElementById('app-view').style.display = 'flex';
                    document.getElementById('userName').innerText = (user.displayName || "User");
                    
                    db.collection('users').doc(user.uid).onSnapshot(function(doc) {
                        if (!doc.exists) db.collection('users').doc(user.uid).set({email: user.email, credits: 10});
                        else document.getElementById('creditDisplay').innerText = (doc.data().credits || 0) + " Credits";
                    }, function(e){ sysLog("DB Error: "+e.message, true); });
                    
                    setTimeout(draw, 500);
                } else {
                    document.getElementById('login-view').style.display = 'flex';
                    document.getElementById('app-view').style.display = 'none';
                }
            });
        }

        // --- 6. UI BRIDGE FUNCTIONS ---
        function promptVal(id, text) {
            var el = document.getElementById(id);
            var val = prompt(text, el.value);
            if(val !== null) { el.value = val; draw(); }
        }
        function cycleShape() {
            var el = document.getElementById('shp');
            var opts = ['rect', 'circle', 'arch-top', 'arch-bottom'];
            el.value = opts[(opts.indexOf(el.value) + 1) % opts.length];
            document.getElementById('lbl-shape').innerText = el.value.replace('-',' ');
            draw();
        }
        function cycleFit() {
            var el = document.getElementById('fitMode');
            var opts = ['cover', 'stretch', 'contain'];
            el.value = opts[(opts.indexOf(el.value) + 1) % opts.length];
            document.getElementById('lbl-fit').innerText = el.value;
            draw();
        }
        function toggleMirror() {
            var el = document.getElementById('mirror');
            el.checked = !el.checked;
            draw();
        }
        function updateColor(val) {
            document.getElementById('clr').value = val;
            draw();
        }
        function cycleZoom() {
            var el = document.getElementById('zoom');
            var val = parseFloat(el.value);
            val = (val >= 2.0) ? 0.5 : val + 0.5;
            el.value = val;
            document.getElementById('lbl-zoom').innerText = val + "x";
            draw();
        }
        function handleUploadClick() {
            document.getElementById('fInput').click();
            var btn = document.getElementById('btn-pro-lock');
            var grp = document.getElementById('pro-tools-grp');
            if(btn.style.display === 'none') {
                 btn.style.display = 'flex'; 
                 btn.querySelector('.tool-label').innerText = "Unlock";
                 grp.style.display = 'none';
                 document.getElementById('sW').value = '';
                 document.getElementById('sH').value = '';
            }
        }

        // --- 7. CORE LOGIC (UNTOUCHED) ---
        document.getElementById('fInput').addEventListener('change', function(e) {
            if (e.target.files[0]) {
                var file = e.target.files[0];
                uploadedFileName = file.name.replace(/\.[^/.]+$/, ""); 
                var reader = new FileReader();
                reader.onload = function(evt) { 
                    tempSrc = evt.target.result;
                    document.getElementById('modal-img').src = tempSrc;
                    document.getElementById('modal').style.display = 'flex';
                };
                reader.readAsDataURL(file);
                e.target.value = '';
            }
        });

        function closeModal(shouldPay) {
            document.getElementById('modal').style.display = 'none';
            if (shouldPay && tempSrc) {
                var ref = db.collection('users').doc(currentUser.uid);
                db.runTransaction(function(t) {
                    return t.get(ref).then(function(doc) {
                        var c = doc.data().credits || 0;
                        if (c < 4) throw "Low Balance";
                        t.update(ref, { credits: c - 4 });
                    });
                }).then(function() {
                    var img = new Image();
                    img.onload = function() {
                        currentImg = img;
                        imgState.x = 0; imgState.y = 0; imgState.zoom = 1.0;
                        document.getElementById('zoom').value = 1.0;
                        document.getElementById('lbl-zoom').innerText = "1.0x";
                        tryColor(tempSrc);
                        draw();
                    };
                    img.src = tempSrc;
                }).catch(function(err) { alert(err); sysLog(err, true); });
            }
            if(!shouldPay) tempSrc = null;
        }

        function tryColor(src) {
            var i = new Image();
            i.crossOrigin = "Anonymous";
            i.onload = function() {
                try {
                    var c = document.createElement('canvas'); c.width=1; c.height=1;
                    c.getContext('2d').drawImage(i,0,0,1,1);
                    var p = c.getContext('2d').getImageData(0,0,1,1).data;
                    var hex = "#" + ((1<<24)+(p[0]<<16)+(p[1]<<8)+p[2]).toString(16).slice(1);
                    document.getElementById('clr').value = hex;
                    draw();
                } catch(e){}
            };
            i.src = src;
        }

        var cvs = document.getElementById('cvs');
        function startDrag(e) {
            imgState.isDragging = true;
            imgState.lastX = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
            imgState.lastY = e.type.includes('touch') ? e.touches[0].clientY : e.clientY;
        }
