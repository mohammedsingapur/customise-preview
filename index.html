<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hakimi Pro v27 - Dark</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>

    <style>
        /* --- DARK THEME VARIABLES --- */
        :root {
            --bg-color: #121212;
            --tool-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --accent: #bb86fc; 
            --btn-bg: #333333;
            --border: #444;
        }

        /* RESET */
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            margin: 0; padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            height: 100vh; width: 100vw;
            overflow: hidden;
            display: flex; flex-direction: column;
        }

        /* --- LOGIN VIEW (RESTORED EXACT STYLES) --- */
        #login-view { 
            position: fixed; inset: 0; z-index: 50; 
            background: var(--bg-color); 
            display: flex; justify-content: center; align-items: center; 
        }
        .auth-box { 
            width: 300px; padding: 30px; text-align: center; 
            background: var(--tool-bg); 
            border-radius: 12px; border: 1px solid var(--border); 
        }
        .btn-google {
            width: 100%; padding: 12px; background: #4285F4; color: white; 
            border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 16px;
            display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 20px;
        }
        #error-bar { background: #7f1d1d; color: #fca5a5; padding: 10px; font-size: 12px; display: none; text-align: center; }

        /* --- MAIN APP LAYOUT (80/20 SPLIT) --- */
        #app-view { display: none; width: 100%; height: 100%; flex-direction: column; }

        /* 1. CANVAS AREA (TOP 80%) */
        .canvas-area {
            flex: 1; 
            width: 100%;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            background: radial-gradient(circle at center, #2c2c2c 0%, #000 100%);
            position: relative; overflow: hidden;
        }
        .canvas-wrapper { width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; }
        
        canvas { 
            background: white; 
            box-shadow: 0 10px 40px rgba(0,0,0,0.6); 
            max-width: 95%; max-height: 80vh; 
            cursor: grab; border: 1px solid #333;
        }
        canvas:active { cursor: grabbing; }

        /* HUD */
        .hud-bar {
            position: absolute; top: 10px; left: 10px; right: 10px;
            display: flex; justify-content: space-between; align-items: center;
            pointer-events: none; z-index: 10;
        }
        .user-tag { background: rgba(0,0,0,0.6); padding: 5px 10px; border-radius: 20px; font-size: 12px; color: #fff; }
        .credit-tag { background: var(--accent); color: #000; font-weight: bold; padding: 5px 10px; border-radius: 20px; font-size: 12px; }

        /* 2. TOOLS AREA (BOTTOM 20%) */
        .tools-area {
            height: 22vh; min-height: 140px;
            width: 100%; background-color: var(--tool-bg);
            border-top: 1px solid var(--border);
            display: flex; align-items: center;
            overflow-x: auto; padding: 0 15px; gap: 15px;
        }
        .tools-area::-webkit-scrollbar { display: none; }

        /* BUTTONS */
        .tool-group { display: flex; flex-direction: column; align-items: center; min-width: 65px; cursor: pointer; }
        .tool-btn {
            width: 50px; height: 50px; background-color: var(--btn-bg);
            border-radius: 50%; display: flex; justify-content: center; align-items: center;
            font-size: 20px; margin-bottom: 6px; border: 1px solid var(--border); color: white;
        }
        .tool-btn:active { transform: scale(0.9); background-color: #555; }
        .tool-label { font-size: 10px; color: #aaa; text-align: center; white-space: nowrap; }
        .pro-tool .tool-btn { border: 2px solid var(--accent); color: var(--accent); }
        .separator { width: 1px; height: 40px; background: #444; min-width: 1px; margin: 0 5px; }

        /* HIDDEN CONTROLS (Used by Logic) */
        .hidden-controls { display: none; }

        /* MODAL */
        #modal { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 100; display: none; justify-content: center; align-items: center; }
        .modal-box { background: var(--tool-bg); width: 85%; max-width: 320px; padding: 20px; border-radius: 12px; text-align: center; border: 1px solid var(--border); }
        .modal-img { max-width: 100%; height: 180px; object-fit: contain; margin: 15px 0; border: 1px solid #444; background: #000; }
        .btn-confirm { width: 100%; padding: 12px; background: var(--accent); color: #000; border: none; border-radius: 6px; font-weight: bold; margin-top: 10px; }
        .btn-cancel { width: 100%; padding: 12px; background: #333; color: #fff; border: none; border-radius: 6px; font-weight: bold; margin-top: 5px; }
    </style>
</head>
<body>

    <div class="hidden-controls">
        <input type="file" id="fInput"> <input type="number" id="tW" value="100">
        <input type="number" id="tH" value="90">
        <input type="text" id="sW">
        <input type="text" id="sH">
        <input type="number" id="gap" value="2">
        <select id="shp">
            <option value="rect">Rect</option><option value="circle">Circle</option>
            <option value="arch-top">Arch Top</option><option value="arch-bottom">Arch Bottom</option>
        </select>
        <input type="range" id="zoom" min="0.1" max="3.0" step="0.1" value="1.0">
        <input type="checkbox" id="mirror">
        <select id="fitMode">
            <option value="cover">Cover</option><option value="stretch">Stretch</option><option value="contain">Contain</option>
        </select>
        <input type="color" id="clr" value="#ffffff">
    </div>

    <div id="error-bar"></div>

    <div id="login-view">
        <div class="auth-box">
            <h2 style="color:white; margin:0;">Hakimi Pro</h2>
            <p style="color:#888; font-size:12px;">Dark Edition</p>
            <button class="btn-google" onclick="googleLogin()"><span>📂</span> Sign in with Google</button>
            <p id="login-msg" style="color:#ff6b6b; font-size:12px; margin-top:15px;"></p>
        </div>
    </div>

    <div id="app-view">
        <div class="canvas-area">
            <div class="hud-bar">
                <div class="user-tag" id="userName">Guest</div>
                <div class="credit-tag" id="creditDisplay">...</div>
            </div>
            <div class="canvas-wrapper">
                <canvas id="cvs"></canvas> </div>
        </div>

        <div class="tools-area">
            <div class="tool-group" onclick="handleUploadClick()">
                <div class="tool-btn" style="background:var(--accent); color:black;">📂</div>
                <span class="tool-label">Upload</span>
            </div>

            <div class="separator"></div>

            <div class="tool-group" onclick="promptVal('tW', 'Width (in)')">
                <div class="tool-btn">↔️</div>
                <span class="tool-label">Width</span>
            </div>
            <div class="tool-group" onclick="promptVal('tH', 'Height (in)')">
                <div class="tool-btn">↕️</div>
                <span class="tool-label">Height</span>
            </div>

            <div class="separator"></div>

            <div class="tool-group" onclick="cycleZoom()">
                <div class="tool-btn">🔍</div>
                <span class="tool-label" id="lbl-zoom">1.0x</span>
            </div>
            <div class="tool-group" onclick="cycleFit()">
                <div class="tool-btn">🖼️</div>
                <span class="tool-label" id="lbl-fit">Cover</span>
            </div>
            <div class="tool-group" onclick="toggleMirror()">
                <div class="tool-btn">🪞</div>
                <span class="tool-label">Flip</span>
            </div>
            <div class="tool-group" onclick="cycleShape()">
                <div class="tool-btn">⬜</div>
                <span class="tool-label" id="lbl-shape">Rect</span>
            </div>
            <div class="tool-group">
                <div class="tool-btn" style="overflow:hidden;">
                    <input type="color" oninput="updateColor(this.value)" value="#ffffff" style="opacity:0; width:100%; height:100%;">
                    <div style="position:absolute; pointer-events:none;">🎨</div>
                </div>
                <span class="tool-label">Color</span>
            </div>

            <div class="separator"></div>

            <div class="tool-group pro-tool" id="btn-lock" onclick="activateProTools()">
                <div class="tool-btn">🔓</div>
                <span class="tool-label">Unlock</span>
            </div>

            <div id="pro-tools-group" style="display:none; display:flex; gap:15px;">
                <div class="tool-group pro-tool" onclick="promptVal('sW', 'Split Widths (e.g. 50,50)')">
                    <div class="tool-btn">✂️</div>
                    <span class="tool-label">Split W</span>
                </div>
                <div class="tool-group pro-tool" onclick="promptVal('sH', 'Split Heights (e.g. 30,30)')">
                    <div class="tool-btn">➗</div>
                    <span class="tool-label">Split H</span>
                </div>
                <div class="tool-group pro-tool" onclick="promptVal('gap', 'Gap Size (in)')">
                    <div class="tool-btn">Gap</div>
                    <span class="tool-label">Gap</span>
                </div>
            </div>

            <div class="separator"></div>

            <div class="tool-group" onclick="downloadCanvas()">
                <div class="tool-btn" style="background:#fff; color:#000;">⬇️</div>
                <span class="tool-label">Save</span>
            </div>
             <div class="tool-group" onclick="auth.signOut()">
                <div class="tool-btn" style="background:#7f1d1d; color:#fff;">X</div>
                <span class="tool-label">Exit</span>
            </div>
        </div>
    </div>

    <div id="modal">
        <div class="modal-box">
            <h3 style="color:var(--text-color)">Confirm Image</h3>
            <img id="modal-img" class="modal-img">
            <p style="color:#aaa">Cost: <b style="color:var(--accent)">4 Credits</b></p>
            <button class="btn-confirm" onclick="closeModal(true)">Confirm</button>
            <button class="btn-cancel" onclick="closeModal(false)">Cancel</button>
        </div>
    </div>

    <script>
        // ----------------------------------------------------
        // ORIGINAL FIREBASE CONFIG
        // ----------------------------------------------------
        var firebaseConfig = {
            apiKey: "AIzaSyBup3s_Z3nVZU-O5da0owglWaFXh5Fpfdg",
            authDomain: "customise-previews.firebaseapp.com",
            projectId: "customise-previews",
            storageBucket: "customise-previews.firebasestorage.app",
            messagingSenderId: "1073406972228",
            appId: "1:1073406972228:web:71ee5db786b2fe2af40711"
        };

        // GLOBAL VARS
        var db, auth, currentUser, currentImg, tempSrc, uploadedFileName;
        var imgState = { x: 0, y: 0, zoom: 1.0, isDragging: false, lastX: 0, lastY: 0 };

        window.onerror = function(msg, url, line) {
            var d = document.getElementById('error-bar');
            d.style.display = 'block';
            d.innerText = "Error Line " + line + ": " + msg;
        };

        // INIT FIREBASE
        try {
            if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
            db = firebase.firestore();
            auth = firebase.auth();
        } catch (e) { alert("Config Error: " + e.message); }

        // LOGIN FUNCTION (UNTOUCHED)
        function googleLogin() {
            var provider = new firebase.auth.GoogleAuthProvider();
            document.getElementById('login-msg').innerText = "Working...";
            auth.signInWithPopup(provider).catch(function(error) {
                document.getElementById('login-msg').innerText = error.message;
            });
        }

        // AUTH STATE LISTENER (UNTOUCHED)
        if (auth) {
            auth.onAuthStateChanged(function(user) {
                if (user) {
                    currentUser = user;
                    document.getElementById('login-view').style.display = 'none';
                    document.getElementById('app-view').style.display = 'flex';
                    document.getElementById('userName').innerText = (user.displayName || "User");
                    
                    db.collection('users').doc(user.uid).onSnapshot(function(doc) {
                        if (!doc.exists) db.collection('users').doc(user.uid).set({email: user.email, credits: 10});
                        else document.getElementById('creditDisplay').innerText = (doc.data().credits || 0) + " Credits";
                    });
                    
                    setTimeout(draw, 500);
                } else {
                    document.getElementById('login-view').style.display = 'flex';
                    document.getElementById('app-view').style.display = 'none';
                }
            });
        }

        // UI HELPER FUNCTIONS (To Bridge New Buttons to Old Logic)
        function promptVal(id, text) {
            var el = document.getElementById(id);
            var val = prompt(text, el.value);
            if(val !== null) { el.value = val; draw(); }
        }
        function cycleShape() {
            var el = document.getElementById('shp');
            var opts = ['rect', 'circle', 'arch-top', 'arch-bottom'];
            var curr = el.value;
            var next = opts[(opts.indexOf(curr) + 1) % opts.length];
            el.value = next;
            document.getElementById('lbl-shape').innerText = next.replace('-',' ');
            draw();
        }
        function cycleFit() {
            var el = document.getElementById('fitMode');
            var opts = ['cover', 'stretch', 'contain'];
            var curr = el.value;
            var next = opts[(opts.indexOf(curr) + 1) % opts.length];
            el.value = next;
            document.getElementById('lbl-fit').innerText = next;
            draw();
        }
        function toggleMirror() {
            var el = document.getElementById('mirror');
            el.checked = !el.checked;
            draw();
        }
        function updateColor(val) {
            document.getElementById('clr').value = val;
            draw();
        }
        function cycleZoom() {
            var el = document.getElementById('zoom');
            var val = parseFloat(el.value);
            if(val >= 2.0) val = 0.5;
            else val += 0.5;
            el.value = val;
            updateZoom();
        }
        function handleUploadClick() {
            document.getElementById('fInput').click();
            var btn = document.getElementById('btn-lock');
            var grp = document.getElementById('pro-tools-group');
            if (btn.style.display === 'none') {
                btn.style.display = 'flex';
                btn.querySelector('.tool-label').innerText = "Unlock";
                grp.style.display = 'none';
                document.getElementById('sW').value = '';
                document.getElementById('sH').value = '';
            }
        }

        // --- ORIGINAL APP LOGIC (EXACTLY AS PROVIDED) ---
        
        document.getElementById('fInput').addEventListener('change', function(e) {
            if (e.target.files[0]) {
                var file = e.target.files[0];
                uploadedFileName = file.name.replace(/\.[^/.]+$/, ""); 
                var reader = new FileReader();
                reader.onload = function(evt) { 
                    tempSrc = evt.target.result;
                    document.getElementById('modal-img').src = tempSrc;
                    document.getElementById('modal').style.display = 'flex';
                };
                reader.readAsDataURL(file);
                e.target.value = '';
            }
        });

        function closeModal(shouldPay) {
            document.getElementById('modal').style.display = 'none';
            if (shouldPay && tempSrc) {
                var ref = db.collection('users').doc(currentUser.uid);
                db.runTransaction(function(t) {
                    return t.get(ref).then(function(doc) {
                        var c = doc.data().credits || 0;
                        if (c < 4) throw "Low Balance";
                        t.update(ref, { credits: c - 4 });
                    });
                }).then(function() {
                    var img = new Image();
                    img.onload = function() {
                        currentImg = img;
                        imgState.x = 0; imgState.y = 0; imgState.zoom = 1.0;
                        document.getElementById('zoom').value = 1.0;
                        document.getElementById('lbl-zoom').innerText = "1.0x";
                        tryColor(tempSrc);
                        draw();
                    };
                    img.src = tempSrc;
                }).catch(function(err) { alert(err); });
            }
            if(!shouldPay) tempSrc = null;
        }

        function tryColor(src) {
            var i = new Image();
            i.crossOrigin = "Anonymous";
            i.onload = function() {
                try {
                    var c = document.createElement('canvas'); c.width=1; c.height=1;
                    c.getContext('2d').drawImage(i,0,0,1,1);
                    var p = c.getContext('2d').getImageData(0,0,1,1).data;
                    var hex = "#" + ((1<<24)+(p[0]<<16)+(p[1]<<8)+p[2]).toString(16).slice(1);
                    document.getElementById('clr').value = hex;
                    draw();
                } catch(e){}
            };
            i.src = src;
        }

        function updateZoom() {
            var v = document.getElementById('zoom').value;
            imgState.zoom = parseFloat(v);
            document.getElementById('lbl-zoom').innerText = v + "x";
            draw();
        }

        // DRAG
        var cvs = document.getElementById('cvs');
        function startDrag(e) {
            imgState.isDragging = true;
            imgState.lastX = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
            imgState.lastY = e.type.includes('touch') ? e.touches[0].clientY : e.clientY;
        }
        function doDrag(e) {
            if(!imgState.isDragging) return;
            e.preventDefault(); 
            var cx = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
            var cy = e.type.includes('touch') ? e.touches[0].clientY : e.clientY;
            imgState.x += (cx - imgState.lastX);
            imgState.y += (cy - imgState.lastY);
            imgState.lastX = cx;
            imgState.lastY = cy;
            draw();
        }
        function stopDrag() { imgState.isDragging = false; }

        cvs.addEventListener('mousedown', startDrag);
        window.addEventListener('mousemove', doDrag);
        window.addEventListener('mouseup', stopDrag);
        cvs.addEventListener('touchstart', startDrag);
