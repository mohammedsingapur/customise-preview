<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | PNP</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>

    <style>
        :root { --bg: #0f0f13; --panel: #1e1e24; --text: #e0e0e0; --acc: #bb86fc; --err: #cf6679; }
        body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; }

        /* --- LAYOUT --- */
        .container { width: 100%; max-width: 800px; display: flex; flex-direction: column; gap: 20px; }
        
        .card { background: var(--panel); padding: 25px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); border: 1px solid #333; }
        h2 { margin: 0 0 20px 0; border-bottom: 1px solid #333; padding-bottom: 10px; color: var(--acc); font-size: 1.2rem; text-transform: uppercase; letter-spacing: 1px; }

        /* --- FORM --- */
        .form-group { display: flex; gap: 10px; margin-bottom: 15px; }
        input { flex: 1; padding: 12px; background: #000; border: 1px solid #444; color: #fff; border-radius: 6px; outline: none; transition: 0.2s; }
        input:focus { border-color: var(--acc); }
        
        button { padding: 12px 25px; background: var(--acc); color: #000; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { filter: brightness(1.1); transform: translateY(-1px); }
        button.secondary { background: #333; color: #fff; }

        /* --- TABLE --- */
        .table-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
        th, td { text-align: left; padding: 12px; border-bottom: 1px solid #333; }
        th { color: #888; font-weight: 600; text-transform: uppercase; font-size: 0.75rem; }
        tr:hover { background: rgba(255,255,255,0.02); }
        .amount-pos { color: #4caf50; font-weight: bold; }

        /* --- STATUS MESSAGES --- */
        #status-msg { margin-top: 10px; font-size: 0.9rem; min-height: 20px; }
        .success { color: #4caf50; }
        .error { color: var(--err); }

        @media (max-width: 600px) {
            .form-group { flex-direction: column; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div style="text-align:center; margin-bottom:10px;">
            <h1 style="margin:0;">PNP Admin</h1>
            <p style="color:#666; font-size:0.8rem;">Credit Management Console</p>
        </div>

        <div class="card">
            <h2>⚡ Quick Recharge</h2>
            <div class="form-group">
                <input type="email" id="uEmail" placeholder="User Email Address">
                <input type="number" id="uCredits" placeholder="Amount (e.g. 50)" style="max-width:150px;">
                <button onclick="processRecharge()">ADD CREDITS</button>
            </div>
            <div id="status-msg"></div>
        </div>

        <div class="card">
            <div class="table-header">
                <h2>📋 Recent Transactions (15 Days)</h2>
                <button class="secondary" onclick="downloadPDF()">⬇ PDF Report</button>
            </div>
            
            <div style="overflow-x:auto;">
                <table id="trans-table">
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>User Email</th>
                            <th>Recharge Amount</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="table-body">
                        <tr><td colspan="4" style="text-align:center; color:#666;">Loading history...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // --- CONFIGURATION ---
        var firebaseConfig = {
            apiKey: "AIzaSyBup3s_Z3nVZU-O5da0owglWaFXh5Fpfdg",
            authDomain: "customise-previews.firebaseapp.com",
            projectId: "customise-previews",
            storageBucket: "customise-previews.firebasestorage.app",
            messagingSenderId: "1073406972228",
            appId: "1:1073406972228:web:71ee5db786b2fe2af40711"
        };
        firebase.initializeApp(firebaseConfig);
        var db = firebase.firestore();

        // --- 1. RECHARGE FUNCTION ---
        async function processRecharge() {
            var email = document.getElementById('uEmail').value.trim();
            var amt = parseInt(document.getElementById('uCredits').value);
            var status = document.getElementById('status-msg');

            if (!email || !amt) {
                status.innerText = "❌ Please enter valid email and amount.";
                status.className = "error";
                return;
            }

            status.innerText = "Processing...";
            status.className = "";

            try {
                // A. Find User ID from Email
                var snapshot = await db.collection('users').where('email', '==', email).get();
                
                if (snapshot.empty) {
                    throw "User not found! Ask them to log in once.";
                }

                var userDoc = snapshot.docs[0];
                var currentCredits = userDoc.data().credits || 0;
                var newCredits = currentCredits + amt;

                // B. Update User Credits
                await db.collection('users').doc(userDoc.id).update({ credits: newCredits });

                // C. Log Transaction (For the Table)
                await db.collection('transactions').add({
                    email: email,
                    amount: amt,
                    date: firebase.firestore.FieldValue.serverTimestamp(),
                    type: 'admin_recharge'
                });

                status.innerText = `✅ Success! Added ${amt} credits to ${email}. (Total: ${newCredits})`;
                status.className = "success";
                
                // Clear inputs & Refresh Table
                document.getElementById('uEmail').value = '';
                document.getElementById('uCredits').value = '';
                loadHistory(); // Refresh table immediately

            } catch (error) {
                console.error(error);
                status.innerText = "❌ Error: " + (typeof error === 'string' ? error : error.message);
                status.className = "error";
            }
        }

        // --- 2. LOAD HISTORY TABLE ---
        function loadHistory() {
            var tbody = document.getElementById('table-body');
            
            // Calculate date 15 days ago
            var d = new Date();
            d.setDate(d.getDate() - 15);
            var cutoff = firebase.firestore.Timestamp.fromDate(d);

            db.collection('transactions')
                .where('date', '>', cutoff)
                .orderBy('date', 'desc')
                .limit(50) // Safety limit
                .get()
                .then(snap => {
                    tbody.innerHTML = "";
                    if (snap.empty) {
                        tbody.innerHTML = "<tr><td colspan='4' style='text-align:center'>No transactions in last 15 days.</td></tr>";
                        return;
                    }

                    snap.forEach(doc => {
                        var data = doc.data();
                        var dateObj = data.date ? data.date.toDate() : new Date();
                        var dateStr = dateObj.toLocaleDateString() + " " + dateObj.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                        
                        var row = `
                            <tr>
                                <td style="color:#aaa;">${dateStr}</td>
                                <td>${data.email}</td>
                                <td class="amount-pos">+${data.amount} Cr</td>
                                <td><span style="background:#132d13; color:#4caf50; padding:2px 6px; borderRadius:4px; font-size:10px;">SUCCESS</span></td>
                            </tr>
                        `;
                        tbody.innerHTML += row;
                    });
                })
                .catch(err => {
                    console.error("Table Error:", err);
                    tbody.innerHTML = `<tr><td colspan='4' style="color:red">Error loading data. (Check Console)</td></tr>`;
                });
        }

        // --- 3. DOWNLOAD PDF ---
        function downloadPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();

            // Header
            doc.setFontSize(18);
            doc.text("PNP Recharge Report", 14, 22);
            doc.setFontSize(11);
            doc.setTextColor(100);
            doc.text("Last 15 Days Activity", 14, 30);

            // Generate Table from HTML
            doc.autoTable({ 
                html: '#trans-table',
                startY: 40,
                theme: 'grid',
                headStyles: { fillColor: [20, 20, 20] },
                styles: { fontSize: 9 }
            });

            // Save
            var date = new Date().toISOString().split('T')[0];
            doc.save(`PNP_Report_${date}.pdf`);
        }

        // Load table on startup
        loadHistory();

    </script>
</body>
</html>
